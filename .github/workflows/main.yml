name: Générer le keystore Android (une seule fois)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Vérifier les secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "❌ ANDROID_KEYSTORE_PASSWORD est manquant."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "❌ ANDROID_KEY_ALIAS est manquant."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "❌ ANDROID_KEY_PASSWORD est manquant."
            exit 1
          fi

          echo "✅ Les secrets Android sont configurés."

      - name: Générer le keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore miltape-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Miltape, OU=Miltape, O=Miltape, L=Unknown, S=Unknown, C=FR"

          echo "✅ Keystore Android généré."

      - name: Encoder le keystore en base64
        run: |
          base64 -w0 miltape-release.jks > miltape-release.base64

          echo "✅ Keystore encodé en base64."
          echo "📦 Le fichier base64 a été créé comme artifact."

      - name: Conserver le keystore encodé
        uses: actions/upload-artifact@v4
        with:
          name: miltape-keystore-base64
          path: miltape-release.base64
          retention-days: 1

      - name: Résumé
        run: |
          echo "======================================"
          echo "✅ KEYSTORE MILTAPE GÉNÉRÉ"
          echo "======================================"
          echo ""
          echo "Secrets utilisés :"
          echo "- ANDROID_KEYSTORE_PASSWORD"
          echo "- ANDROID_KEY_ALIAS"
          echo "- ANDROID_KEY_PASSWORD"
          echo ""
          echo "⚠️ Aucun mot de passe n'est affiché."
          echo "⚠️ Le keystore base64 est conservé comme artifact pendant 1 jour."
          echo "======================================"
