name: Firecrawl - Analyse Miltape

on:
  workflow_dispatch:

jobs:
  firecrawl:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Vérifier la clé Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "❌ FIRECRAWL_API_KEY n'est pas configurée."
            exit 1
          fi

          echo "✅ Clé Firecrawl détectée."

      - name: Créer le dossier des résultats
        run: |
          mkdir -p firecrawl-results

      - name: Récupérer server.js avec Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -e

          curl -sS \
            -X POST \
            -H "Authorization: Bearer ${FIRECRAWL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://github.com/cryptochaouki-droid/miltape-backend/blob/main/server.js",
              "formats": ["markdown"]
            }' \
            "https://api.firecrawl.dev/v2/scrape" \
            > firecrawl-results/server.js.json

          echo "✅ server.js récupéré."

      - name: Récupérer package.json avec Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -e

          curl -sS \
            -X POST \
            -H "Authorization: Bearer ${FIRECRAWL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://github.com/cryptochaouki-droid/miltape-backend/blob/main/package.json",
              "formats": ["markdown"]
            }' \
            "https://api.firecrawl.dev/v2/scrape" \
            > firecrawl-results/package.json.json

          echo "✅ package.json récupéré."

      - name: Récupérer index.html avec Firecrawl
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -e

          curl -sS \
            -X POST \
            -H "Authorization: Bearer ${FIRECRAWL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://github.com/cryptochaouki-droid/miltape-backend/blob/main/index.html",
              "formats": ["markdown"]
            }' \
            "https://api.firecrawl.dev/v2/scrape" \
            > firecrawl-results/index.html.json

          echo "✅ index.html récupéré."

      - name: Vérifier les résultats
        run: |
          set -e

          for file in \
            firecrawl-results/server.js.json \
            firecrawl-results/package.json.json \
            firecrawl-results/index.html.json
          do
            if [ ! -s "$file" ]; then
              echo "❌ Résultat vide : $file"
              exit 1
            fi

            echo "✅ Résultat valide : $file"
          done

      - name: Conserver les résultats Firecrawl
        uses: actions/upload-artifact@v4
        with:
          name: firecrawl-miltape-files
          path: firecrawl-results/
