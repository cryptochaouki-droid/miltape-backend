name: Générer le keystore Android (une seule fois)

# ⚠️ IMPORTANT : ce dépôt DOIT être PRIVÉ avant de lancer ce workflow.
# Les valeurs saisies ci-dessous apparaissent en clair dans les logs de ce run —
# si le dépôt est public, n'importe qui peut les lire. Une fois les secrets
# enregistrés (étape suivante), supprime ce run depuis l'onglet Actions
# (bouton "..." → Delete workflow run) pour effacer les logs.

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Mot de passe du keystore (choisis-en un solide, note-le quelque part)"
        required: true
      key_alias:
        description: "Alias de la clé"
        required: true
        default: "miltape"
      key_password:
        description: "Mot de passe de la clé (peut être identique au précédent)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Générer le keystore
        run: |
          keytool -genkeypair -v -keystore miltape-release.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Miltape, OU=Miltape, O=Miltape, L=Unknown, S=Unknown, C=FR"

      - name: Afficher le keystore encodé en base64
        run: |
          echo "===== COPIE TOUT LE BLOC CI-DESSOUS (une seule ligne, sans espace ni retour à la ligne) ====="
          base64 -w0 miltape-release.jks
          echo ""
          echo "===== FIN DU BLOC À COPIER ====="
          echo ""
          echo "Enregistre ensuite ces 4 secrets dans Settings > Secrets and variables > Actions :"
          echo "  ANDROID_KEYSTORE_BASE64  = le bloc ci-dessus"
          echo "  ANDROID_KEYSTORE_PASSWORD = ${{ github.event.inputs.keystore_password }}"
          echo "  ANDROID_KEY_ALIAS        = ${{ github.event.inputs.key_alias }}"
          echo "  ANDROID_KEY_PASSWORD     = ${{ github.event.inputs.key_password }}"
