name: Build APK Miltape

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android si absente
        run: test -d android || npx cap add android

      - name: Synchroniser les assets web dans le projet natif
        run: npx cap sync android

      - name: Restaurer le keystore depuis le secret
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/miltape-release.jks

      - name: Construire l'APK signé
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/miltape-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v7  # ✅ v4 → v7
        with:
          name: miltape-apk
          path: android/app/build/outputs/apk/release/app-release.apk
