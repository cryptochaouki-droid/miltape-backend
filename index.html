<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Test Connexion</h1>
    <input type="text" id="pseudo" placeholder="Pseudo">
    <button id="btn">VALIDER</button>

    <script>
        // Mets ici ton lien exact Railway entre les guillemets
        const socket = io("https://ton-projet.up.railway.app");

        socket.on('connect', () => {
            console.log("Connecté au serveur ! ID :", socket.id);
        });

        document.getElementById('btn').onclick = () => {
            const p = document.getElementById('pseudo').value;
            if(p.trim() !== "") {
                socket.emit('setPseudo', p);
            }
        };

        socket.on('pseudoAccepted', () => {
            alert("Pseudo validé avec succès par le serveur !");
        });
    </script>
</body>
</html>
