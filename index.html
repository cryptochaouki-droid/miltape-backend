<script>
const socket=io("https://miltape-backend-production.up.railway.app");

const tapButton=document.getElementById('tapButton'),tapButtonCount=document.getElementById('tapButtonCount'),liveTapsCount=document.getElementById('liveTapsCount'),enterChallenge=document.getElementById('enterChallenge'),enterChallengeTop=document.getElementById('enterChallengeTop'),tapMessage=document.getElementById('tapMessage'),onlineCount=document.getElementById('onlineCount'),leaderboardList=document.getElementById('leaderboardList'),chatInput=document.getElementById('chatInput'),chatSend=document.getElementById('chatSend'),chatMessages=document.getElementById('chatMessages'),betInput=document.getElementById('betInput'),payButton=document.getElementById('payButton'),tokenSelect=document.getElementById('tokenSelect'),demoBtn=document.getElementById('demomodebtn'),demoStatus=document.getElementById('demoStatus'),demoToggleLabel=document.getElementById('demoToggleLabel'),menuButton=document.getElementById('menuButton'),sideMenu=document.getElementById('sideMenu'),closeMenu=document.getElementById('closeMenu'),menuOverlay=document.getElementById('menuOverlay'),resetGameBtn=document.getElementById('resetGameBtn');
let isPlaying=false,isPaid=false,myPlayerId=null,myBet=10,myWallet=null,myToken='USDT';
let myDepositAmount = 0; // <-- MONTANT EXACT UNIQUE
const API_URL="https://miltape-backend-production.up.railway.app";

function getDeviceId() {
    let deviceId = localStorage.getItem("miltape_device_id");
    if (!deviceId) {
        if (crypto.randomUUID) { deviceId = crypto.randomUUID(); }
        else { deviceId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); }
        localStorage.setItem("miltape_device_id", deviceId);
    }
    return deviceId;
}
const deviceId = getDeviceId();

function formatAmount(value) { return Number(parseFloat(value).toFixed(8)).toString(); }
function hapticLight(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}}
function hapticMedium(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('medium')}catch(e){}}
function hapticHeavy(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy')}catch(e){}}
function hapticSuccess(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}}
function hapticError(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.notificationOccurred('error')}catch(e){}}

// ==========================================================
// AUDIO & EFFETS
// ==========================================================
let audioCtx;
let soundEnabled = true;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });
function playBeep(freq = 800, duration = 0.1, type = 'sine', volume = 0.1) {
    if (!soundEnabled) return;
    try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
}
function playWarTrumpet() {
    initAudio();
    let notes = [523, 659, 784, 1046];
    notes.forEach((freq, i) => { setTimeout(() => playBeep(freq, 0.5, 'sawtooth', 0.15), i * 250); });
}
function playLetsGoVoice() {
    try {
        if ('speechSynthesis' in window) {
            let u = new SpeechSynthesisUtterance("Let's go !");
            u.lang = 'en-US';
            u.rate = 1.1;
            u.pitch = 1.2;
            let voices = speechSynthesis.getVoices();
            let femaleVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('female')) || voices[0];
            if (femaleVoice) u.voice = femaleVoice;
            speechSynthesis.speak(u);
            setTimeout(() => playBeep(1000, 0.1, 'square'), 150);
        } else { playBeep(1000, 0.1, 'square'); }
    } catch (e) { playBeep(1000, 0.1, 'square'); }
}

// ... (Le reste des fonctions updateDemoUI, toggleDemoMode, etc. reste identique) ...

async function restoreSession(){
    const playerId=localStorage.getItem("miltape_player_id"),
    wallet=localStorage.getItem("miltape_player_wallet"),
    name=localStorage.getItem("miltape_player_name");
    if(!playerId||!wallet||!name){console.log("🔍 Aucune session trouvée.");return!1}
    socket.emit("player:restore",{playerId, wallet, deviceId});
    return!0
}
socket.on('connect',async()=>{await restoreSession()});
socket.on('reconnect',async()=>{await restoreSession()});
socket.on('connect_error',(err)=>{console.error('Erreur de connexion Socket :',err.message);hapticError();});

function joinGame(){
    initAudio();
    const telegramName=getTelegramUser();
    let name=telegramName||prompt("Entre ton pseudo pour le classement :");
    if(!name)return;
    let wallet;
    if(demoMode){
        try{
            if(typeof tronWeb!=='undefined'&&tronWeb&&tronWeb.createAccount){
                const account=tronWeb.createAccount();
                wallet=account.address.base58;
            } else {
                wallet="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb";
            }
        }catch(e){wallet="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb";}
    }
    else{
        wallet=prompt("Entre ton adresse TRON (ex: T...) :");
        if(!wallet)return;
    }
    
    const token=tokenSelect?tokenSelect.value:'USDT';
    let bet=10;
    if(betInput){
        const rawBet=parseFloat(String(betInput.value).replace(',', '.'));
        if(!isNaN(rawBet)&&rawBet>=0.5&&rawBet<=1000000000000){bet=rawBet}else{bet=10}
    }
    myBet=bet; myWallet=wallet; myToken=token;
    socket.emit("player:join",{name, wallet, bet, token, deviceId});
    hapticMedium();
}

// ==========================================================
// RECEPTION DU MONTANT EXACT DEPUIS LE SERVEUR
// ==========================================================
socket.on("player:joined",(data)=>{
    if(data.success){
        isPlaying=!0;isPaid=!1;myPlayerId=data.player.id;myToken=data.player.token||'USDT';
        
        // Récupération du montant exact unique
        myDepositAmount = data.player.depositAmount || data.player.bet;
        
        if(tapButton)tapButton.disabled=!0;
        if(enterChallenge)enterChallenge.style.display="none";
        if(tapButtonCount)tapButtonCount.innerText=data.player.taps;
        if(liveTapsCount)liveTapsCount.innerText=data.player.taps;
        
        localStorage.setItem("miltape_player_id",data.player.id);
        localStorage.setItem("miltape_player_wallet",data.player.wallet);
        localStorage.setItem("miltape_player_name",data.player.name);
        localStorage.setItem("miltape_player_bet",data.player.bet.toString());
        localStorage.setItem("miltape_player_token",myToken);
        
        // Afficher le montant exact dans l'input
        if(betInput) betInput.value = formatAmount(myDepositAmount);
        
        if(demoMode){
            isPaid=!0;
            if(tapButton)tapButton.disabled=!1;
            if(tapMessage)tapMessage.innerText="🔬 MODE DÉMO : "+data.player.name+", tape !";
            if(payButton)payButton.style.display='none';
            // APPEL À LA ROUTE DÉMO ISOLÉE
            fetch(API_URL+"/api/demo/verify",{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({playerId:data.player.id})
            }).then(res=>res.json()).then(data=>{if(data.verified)console.log("✅ Mode démo : paiement simulé validé");}).catch(err=>console.error("Erreur mode démo:",err));
        } else {
            if(payButton){
                payButton.style.display='block';
                payButton.onclick=()=>initiatePayment(data.player.wallet, myDepositAmount); // Envoi du montant exact
            }
        }
        
        hapticMedium();
        playLetsGoVoice();
        playWarTrumpet();
    }
});

socket.on("player:restored",(data)=>{
    if(data.success){
        isPlaying=!0;myPlayerId=data.player.id;myWallet=data.player.wallet;myBet=data.player.bet||10;myToken=data.player.token||'USDT';
        
        myDepositAmount = data.player.depositAmount || data.player.bet;
        
        if(demoMode){
            isPaid=!0;
            if(tapButton)tapButton.disabled=!1;
            if(tapMessage)tapMessage.innerText="🔬 Mode démo : bon retour "+data.player.name+" !";
        } else {
            isPaid=data.player.paid||!1;
            if(tapButton)tapButton.disabled=!isPaid;
            if(tapMessage)tapMessage.innerText=isPaid?"✅ Revenu ! ÉTAPE 3 : Tape maintenant !":"💰 ÉTAPE 2 : Paie ta mise pour taper !";
            if(payButton){
                if(!isPaid){
                    payButton.style.display='block';
                    payButton.onclick=()=>initiatePayment(data.player.wallet, myDepositAmount);
                }
                else payButton.style.display='none';
            }
        }
        if(betInput) betInput.value = formatAmount(myDepositAmount);
        // ... (Suite restaurée) ...
    }
});

// ==========================================================
// PAIEMENT AVEC LE MONTANT EXACT
// ==========================================================
function initiatePayment(wallet, amount) {
    const finalAmount = myDepositAmount > 0 ? myDepositAmount : amount;
    const token = tokenSelect ? tokenSelect.value : (localStorage.getItem("miltape_player_token") || 'USDT');

    fetch(API_URL + "/api/wallet")
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                const serverWallet = data.wallet;
                const startParam = encodeURIComponent('transfer-' + serverWallet + '-' + formatAmount(finalAmount) + '-' + token);
                const paymentUrl = 'https://t.me/wallet?start=' + startParam;
                
                window.open(paymentUrl, '_blank');
                hapticMedium();
                
                alert("💰 Envoie EXACTEMENT " + formatAmount(finalAmount) + " " + token + " (TRC20) vers :\n" + serverWallet + "\n\n✅ Le paiement sera détecté automatiquement !");
            } else {
                hapticError();
                alert("❌ Impossible de récupérer le wallet du serveur.");
            }
        })
        .catch(err => { hapticError(); console.error(err); });
}

// ... (Le reste du script (timer, chat, classement, confetti, etc.) reste identique) ...
</script>
