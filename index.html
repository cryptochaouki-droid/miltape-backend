<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #05020a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { font-size: 1.5rem; color: #ffcc00; margin-bottom: 20px; }
        #online-count { color: #00ff66; font-weight: bold; }
        #btn-tap { width: 200px; height: 200px; border-radius: 50%; background: #ff6a00; border: none; cursor: pointer; color: white; font-size: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>MILTAPE</h1>
        <div id="online-count">0 EN LIGNE</div>
    </div>
    
    <button id="btn-tap" onclick="tap()">TAP !</button>

    <script>
        const socket = io();

        // Mise à jour du compteur en direct
        socket.on('playerCountUpdate', (count) => {
            document.getElementById('online-count').innerText = count + " EN LIGNE";
        });

        function tap() {
            socket.emit('playerTap');
        }
    </script>
</body>
</html>
