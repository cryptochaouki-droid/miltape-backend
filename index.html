<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Test Connexion</h1>
    <input type="text" id="pseudo" placeholder="Pseudo">
    <button onclick="testerClic()">VALIDER</button>

    <script>
        const socket = io();

        function testerClic() {
            const p = document.getElementById('pseudo').value;
            alert("Bouton cliqué avec le pseudo : " + p);
            socket.emit('setPseudo', p);
        }

        socket.on('pseudoAccepted', () => {
            alert("Le serveur a répondu : OK !");
        });
    </script>
</body>
</html>
