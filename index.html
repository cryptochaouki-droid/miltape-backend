<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE WORLD CHALLENGE</title>
    <style>
        /* ========================================================================== */
        /* FINITION PREMIUM "WOW" - SURCOUCHE VISUELLE ÉLÉGANTE                       */
        /* ========================================================================== */
        :root {
            --miltape-blue-deep: #070b19;
            --miltape-glow-blue: rgba(0, 162, 255, 0.35);
            --miltape-glow-gold: rgba(255, 215, 0, 0.25);
            --miltape-gold: #ffd700;
        }

        /* Effet de particules lumineuses subtiles en arrière-plan */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 140, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.04) 0%, transparent 40%),
                radial-gradient(white 1px, transparent 0);
            background-size: 100% 100%, 100% 100%, 50px 50px;
            background-position: 0 0, 0 0, 25px 25px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 999;
        }

        /* Profondeur et halos lumineux sur les cartes principales */
        .card, .panel, .box, section, .container-fluid {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.08),
                        0 0 15px var(--miltape-glow-blue);
            border: 1px solid rgba(0, 162, 255, 0.18);
            transition: all 0.3s ease;
        }

        /* 👆 2. BOUTON TAP : Pulsation, halo, profondeur et effet press */
        #tap-button, .tap-btn, button.tap, [id*="tap"], [class*="tap-btn"] {
            position: relative;
            box-shadow: 0 0 25px var(--miltape-glow-blue), 
                        0 6px 20px rgba(0, 0, 0, 0.5),
                        inset 0 2px 4px rgba(255, 255, 255, 0.3);
            animation: tapPulse 3s infinite ease-in-out;
            transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease !important;
        }

        @keyframes tapPulse {
            0%, 100% {
                box-shadow: 0 0 20px var(--miltape-glow-blue), 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 35px rgba(0, 162, 255, 0.6), 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.5);
            }
        }

        #tap-button:active, .tap-btn:active, button.tap:active, [id*="tap"]:active, [class*="tap-btn"]:active {
            transform: scale(0.94) translateY(2px) !important;
            box-shadow: 0 0 10px var(--miltape-glow-blue), 0 2px 10px rgba(0, 0, 0, 0.8), inset 0 4px 8px rgba(0, 0, 0, 0.4) !important;
        }

        /* ⏱️ 3. CHRONO : Chiffres nets, lueur et animation subtile */
        #chrono, .timer, [id*="chrono"], [class*="timer"] {
            text-shadow: 0 0 12px var(--miltape-glow-blue);
            letter-spacing: 1px;
            animation: chronoGlow 2s infinite alternate;
        }

        @keyframes chronoGlow {
            from { text-shadow: 0 0 8px rgba(0, 162, 255, 0.4); }
            to { text-shadow: 0 0 16px rgba(0, 162, 255, 0.8), 0 0 2px #ffffff; }
        }

        /* 🏆 4. CLASSEMENT : Compétition, lueur et mise en valeur du TOP 3 */
        .ranking-item:nth-child(1), tr:nth-child(1) .rank, .top-1 {
            border-left: 3px solid #ffd700;
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12), transparent);
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .ranking-item:nth-child(2), tr:nth-child(2) .rank, .top-2 {
            border-left: 3px solid #e0e0e0;
            background: linear-gradient(90deg, rgba(224, 224, 224, 0.08), transparent);
        }

        .ranking-item:nth-child(3), tr:nth-child(3) .rank, .top-3 {
            border-left: 3px solid #cd7f32;
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.08), transparent);
        }

        .ranking-item, [class*="rank"], .leaderboard-row {
            transition: all 0.25s ease;
        }

        .ranking-item:hover, .leaderboard-row:hover {
            transform: translateX(4px);
            background-color: rgba(0, 162, 255, 0.07);
        }

        /* 💬 5. CHAT LIVE : Statut lumineux et bulles propres */
        .live-badge, [class*="live"], .status-live {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .live-badge::before, [class*="live"]::before {
            content: '';
            width: 7px;
            height: 7px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: liveBlink 1.5s infinite;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 12px #00ff66; }
        }

        .chat-message, .message {
            border-radius: 10px;
            border: 1px solid rgba(0, 162, 255, 0.12);
            background: rgba(7, 11, 25, 0.6);
            backdrop-filter: blur(5px);
            animation: fadeInMessage 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInMessage {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🎮 6. BOUTONS : Profondeur, ombres et transitions fluides */
        button, .btn {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
            position: relative;
            overflow: hidden;
        }

        button::after, .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: 0.5s;
        }

        button:hover::after, .btn:hover::after {
            left: 100%;
        }

        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 162, 255, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.25);
            border-color: rgba(0, 162, 255, 0.4);
        }

        /* 📱 7. MOBILE : Optimisation stricte sans casse de structure */
        @media (max-width: 768px) {
            * {
                -webkit-tap-highlight-color: transparent;
            }
        }
    </style>
</head>
