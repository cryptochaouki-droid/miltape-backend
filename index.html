<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#090014">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Miltape World Challenge</title>

    <link rel="icon" href="miltape-logo-art.jpg">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

        <button class="menu-button" id="menuButton">
            ☰
        </button>

        <div class="online">
            <span class="online-dot"></span>
            <strong>1,254</strong>
            <span>EN LIGNE</span>
        </div>

        <div class="wallet-box">
            <small>SOLDE</small>
            <strong id="balance">100.00 €</strong>
        </div>

        <button class="wallet-button">
            💰
        </button>

    </header>


    <!-- =====================================================
         HERO / LOGO
    ====================================================== -->

    <section class="hero">

        <img
            src="miltape-reference.jpg"
            alt="Miltape World Challenge"
            class="hero-image"
        >

        <div class="hero-content">

            <h1>
                MILTAPE
                <span>WORLD CHALLENGE</span>
            </h1>

            <p class="slogan">
                <strong>TAPE.</strong>
                CLASSE-TOI.
                <strong>GAGNE.</strong>
            </p>

        </div>

    </section>


    <!-- =====================================================
         RÈGLES RAPIDES
    ====================================================== -->

    <section class="rules">

        <div class="rule">
            <span class="rule-icon">⏱️</span>
            <strong>10 MINUTES</strong>
            <small>PAR PARTIE</small>
        </div>

        <div class="rule">
            <span class="rule-icon">🏆</span>
            <strong>TOP 5</strong>
            <small>SEULEMENT</small>
        </div>

        <div class="rule">
            <span class="rule-icon">🪙</span>
            <strong>2X</strong>
            <small>TA MISE</small>
        </div>

    </section>


    <!-- =====================================================
         IMAGE TAP
    ====================================================== -->

    <section class="tap-visual">

        <img
            src="tap-art.jpg"
            alt="Tap Miltape"
        >

    </section>


    <!-- =====================================================
         BOUTON JOUER
    ====================================================== -->

    <button
        id="playButton"
        class="main-play-button"
        data-play
    >
        <span>JOUER MAINTENANT</span>
        <b>➜</b>
    </button>


    <!-- =====================================================
         CHOIX DE MISE
    =================================================
