<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miltape World Challenge</title>
    <style>
        body {
            background-color: #0c0814;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #181124;
            border: 2px solid #f0b90b;
            border-radius: 16px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #f0b90b;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            background: #231834;
            border: 1px solid #4a356c;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #f0b90b;
        }
        .error-box {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff4d4d;
            border-radius: 8px;
            padding: 10px;
            color: #ff4d4d;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .btn-pay {
            width: 100%;
            background: linear-gradient(to bottom, #f0b90b, #d49f05);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-pay:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-group">
        <label>TA MISE</label>
        <input type="number" id="mise-input" value="1" readonly>
    </div>

    <div class="form-group">
        <label>TON NOM</label>
        <input type="text" id="name-input" value="Fr">
    </div>

    <div class="form-group">
        <label>TON WALLET TRON (Pour recevoir les gains)</label>
        <!-- Champ corrigé : Input modifiable pour permettre la saisie et le collage direct -->
        <input type="text" id="tron-wallet" placeholder="Colle ton adresse Tron ici (commençant par T)">
    </div>

    <div id="wallet-error" class="error-box" style="display: none;">
        ❌ Veuillez entrer une adresse Tron valide.
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
        <input type="checkbox" id="terms" checked style="width: auto;">
        <label for="terms" style="margin: 0; color: #ccc; font-weight: normal;">J'accepte les conditions d'utilisation de Miltape World Challenge.</label>
    </div>

    <button class="btn-pay" id="pay-btn">PAYER 1 STARS ET JOUER</button>
</div>

<script>
    const walletInput = document.getElementById('tron-wallet');
    const payBtn = document.getElementById('pay-btn');
    const errorBox = document.getElementById('wallet-error');

    payBtn.addEventListener('click', () => {
        const walletAddress = walletInput.value.trim();
        
        if (!walletAddress || !walletAddress.startsWith('T')) {
            errorBox.style.display = 'block';
            errorBox.textContent = "Colle une adresse Tron valide (commençant par T).";
            walletInput.focus();
            return;
        }

        errorBox.style.display = 'none';
        // Logique de lancement et de paiement Telegram Stars
        alert("Adresse enregistrée avec succès : " + walletAddress);
    });
</script>

</body>
</html>
