<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE WORLD CHALLENGE</title>
    <style>
        /* --- STYLES GÉNÉRAUX & FOND (INCHANGÉS) --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- ÉLÉMENTS NON TOUCHÉS (LOGO, BANNIÈRE, JACKPOT, ETC.) --- */
        .logo, .banner, .jackpot, .play-btn, .duel-mode, .stake, .leaderboard, .chat, .tron, .blockchain, .payment, .menu {
            /* Styles de base fictifs pour respecter la disposition */
            text-align: center;
        }

        /* ==========================================================
           AMÉLIORATION UNIQUEMENT DU CHRONOMÈTRE (PREMIUM & GAMING)
           ========================================================== */
        #timer, .timer {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00f3ff;
            text-align: center;
            
            /* Effet de profondeur et lueur subtile */
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5), 
                         0 0 20px rgba(0, 243, 255, 0.2),
                         0 2px 4px rgba(0, 0, 0, 0.8);
            
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.4));
            transition: all 0.3s ease-in-out;
            
            /* Emplacement et taille d'origine préservés via flex/box standards */
            padding: 10px 20px;
            background: rgba(0, 243, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.15);
        }

        /* État critique (lorsque le temps devient faible) : accentuation subtile */
        #timer.warning, .timer.warning {
            color: #ff3366;
            text-shadow: 0 0 12px rgba(255, 51, 102, 0.7), 
                         0 0 25px rgba(255, 51, 102, 0.3),
                         0 2px 4px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 51, 102, 0.3);
            animation: pulse-timer 1.5s infinite ease-in-out;
        }

        @keyframes pulse-timer {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 51, 102, 0.4));
            }
            50% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.8));
            }
        }

        /* --- BOUTON TAP (EXACTEMENT COMME IL EST, INCHANGÉ) --- */
        #tap-btn, .tap-btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 243, 255,.4);
            transition: transform 0.1s ease;
        }

        #tap-btn:active, .tap-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Éléments structurels existants -->
        <div class="logo">MILTAPE WORLD CHALLENGE</div>
        
        <!-- CHRONOMÈTRE AMÉLIORÉ VISUELLEMENT -->
        <div id="timer" class="timer">00:30</div>

        <!-- BOUTON TAP PRÉSERVÉ STRICTEMENT -->
        <button id="tap-btn" class="tap-btn" onclick="handleTap()">TAP !</button>
    </div>

    <script>
        // --- LOGIQUE JAVASCRIPT EXISTANTE (INCHANGÉE) ---
        function handleTap() {
            console.log("Tap enregistré !");
        }

        // Exemple de logique du compte à rebours d'origine conservée
        let timeLeft = 30;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;

            // Activation de la classe d'alerte subtile lorsque le temps devient faible (< 10s)
            if (timeLeft <= 10) {
                timerElement.classList.add('warning');
            }

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "00:00";
            }
        }, 1000);
    </script>
</body>
</html>
