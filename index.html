<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game World Challenge</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .header h1 {
      font-size: 1.8rem;
      background: linear-gradient(45deg, #f39c12, #f1c40f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .jackpot-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 10px 20px;
      margin: 10px 0;
      text-align: center;
      backdrop-filter: blur(5px);
    }
    .jackpot-amount {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2ecc71;
    }
    .jackpot-timer {
      font-size: 0.9rem;
      color: #bdc3c7;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }
    .tap-button {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #f39c12, #d35400);
      border: none;
      box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4);
      cursor: pointer;
      font-size: 2rem;
      color: white;
      font-weight: bold;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .tap-button:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(243, 156, 18, 0.2);
    }
    .score-display {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0;
      color: #fff;
    }
    .chat-container {
      width: 100%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      height: 150px;
      margin-top: 15px;
      overflow: hidden;
    }
    .chat-messages {
      flex-grow: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .chat-input-area {
      display: flex;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chat-input {
      flex-grow: 1;
      background: transparent;
      border: none;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .chat-send {
      background: #f39c12;
      border: none;
      color: white;
      padding: 0 15px;
      cursor: pointer;
      font-weight: bold;
    }
    #installPwaButton {
      display: none;
      margin-top: 10px;
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #installPwaButton.show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Game World Challenge</h1>
  </div>

  <div class="jackpot-box">
    <div class="jackpot-amount" id="jackpotAmount">0.00 USDT</div>
    <div class="jackpot-timer" id="jackpotCountdown">Prochain tirage : --:--:--</div>
  </div>

  <div class="game-container">
    <div class="score-display" id="score">0</div>
    <button class="tap-button" id="tapButton">TAP</button>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chatInput" placeholder="Envoyer un message...">
      <button class="chat-send" id="chatSend">Envoyer</button>
    </div>
  </div>

  <button id="installPwaButton">Installer l'Application</button>

  <!-- Inclusion de Socket.io (fourni par le serveur Node.js) -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Variables du jeu
    let score = 0;
    const scoreElement = document.getElementById('score');
    const tapButton = document.getElementById('tapButton');

    // Gestion du clic / tap
    tapButton.addEventListener('click', () => {
      score++;
      scoreElement.textContent = score;
      socket.emit('player:tap', { points: 1 });
    });

    // Synchronisation du score global ou personnel via WebSocket
    socket.on('score:update', (data) => {
      if (data.score !== undefined) {
        score = data.score;
        scoreElement.textContent = score;
      }
    });

    // Gestion du Chat en temps réel
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');

    function appendMessage(user, text) {
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `<strong>${user}:</strong> ${text}`;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatSend.addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (text) {
        socket.emit('chat:message', { text });
        chatInput.value = '';
      }
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        chatSend.click();
      }
    });

    socket.on('chat:message', (data) => {
      appendMessage(data.user || 'Anonyme', data.text);
    });

    // Gestion de la Cagnotte et du Compte à rebours
    let countdownInterval = null;

    function updateJackpotCountdown(endTime) {
      if (countdownInterval) clearInterval(countdownInterval);

      const targetTime = new Date(endTime).getTime();
      const countdownElement = document.getElementById('jackpotCountdown');

      countdownInterval = setInterval(() => {
        const now = new Date().getTime();
        const diff = targetTime - now;

        if (diff <= 0) {
          countdownElement.textContent = "Tirage en cours...";
          clearInterval(countdownInterval);
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        
        let text = "Prochain tirage : ";
        if (days > 0) text += days + "j ";
        text += hours.toString().padStart(2, '0') + ":" + 
                minutes.toString().padStart(2, '0') + ":" + 
                seconds.toString().padStart(2, '0');
        
        countdownElement.textContent = text;
      }, 1000);
    }

    socket.on("jackpot:update", (data) => {
      const jackpotAmount = document.getElementById('jackpotAmount');
      if (jackpotAmount) {
        jackpotAmount.textContent = (data.amount || 0) + " USDT";
      }
      if (data.nextDrawTime) {
        updateJackpotCountdown(data.nextDrawTime);
      }
    });

    // Demander les infos de la cagnotte au chargement initial
    socket.emit("jackpot:get");

    // ==========================================
    // INSTALLATION PWA (Service Worker & Prompt)
    // ==========================================
    let deferredPrompt = null;
    const installPwaButton = document.getElementById('installPwaButton');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installPwaButton) installPwaButton.classList.add('show');
    });

    if (installPwaButton) {
      installPwaButton.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('✅ PWA installée avec succès');
        }
        deferredPrompt = null;
        installPwaButton.classList.remove('show');
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('🎉 PWA installée');
      if (installPwaButton) installPwaButton.classList.remove('show');
      deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ Service Worker enregistré avec succès:', reg.scope))
          .catch(err => console.log('❌ Échec de l\'enregistrement du Service Worker:', err));
      });
    }
  </script>
</body>
</html>
