<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE WORLD CHALLENGE</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK Telegram WebApp si nécessaire -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-deep-blue text-white font-sans min-h-screen flex flex-col items-center justify-between p-4">

    <!-- MODALE PSEUDO -->
    <div id="nameModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-cyan-500/50 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-cyan-400">BIENVENUE SUR MILTAPE</h2>
            <p class="text-sm text-gray-300 mb-4">Entre ton pseudo pour commencer la compétition mondiale :</p>
            <input type="text" id="usernameInput" placeholder="Ton pseudo..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white mb-4 focus:outline-none focus:border-cyan-400">
            <button id="saveNameBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg transition">VALIDER</button>
        </div>
    </div>

    <!-- MODALE WALLET -->
    <div id="walletModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
        <div class="bg-slate-900 border border-purple-500/50 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-purple-400">CONNEXION WALLET</h2>
            <p class="text-sm text-gray-300 mb-4">Connecte ton portefeuille pour lier tes gains et participer aux paiements :</p>
            <button id="connectWalletBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg mb-2 transition">Connecter TonConnect</button>
            <button id="closeWalletBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-gray-400 py-2 rounded-lg transition">Fermer</button>
        </div>
    </div>

    <!-- EN-TÊTE / HEADER -->
    <header class="w-full max-w-md flex justify-between items-center py-3 border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <span class="font-bold tracking-wider text-cyan-400">MILTAPE</span>
        </div>
        <div class="flex space-x-2">
            <button id="openWalletModal" class="bg-slate-800 border border-purple-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold text-purple-300">Wallet</button>
            <button id="demoModeBtn" class="bg-slate-800 border border-amber-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold text-amber-300">Mode Démo</button>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL DU JEU -->
    <main class="w-full max-w-md flex flex-col items-center my-auto space-y-6 text-center">
        <!-- Chrono / Compétition -->
        <div class="bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-xl">
            <span class="text-xs text-gray-400 uppercase tracking-widest">Fin du round dans :</span>
            <div id="timerDisplay" class="text-xl font-extrabold text-red-500">02:14:55</div>
        </div>

        <!-- Zone de Tap / Jeu -->
        <div class="relative flex items-center justify-center">
            <button id="tapButton" class="w-48 h-48 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20 flex items-center justify-center active:scale-95 transition transform">
                <span class="text-2xl font-black tracking-wider text-slate-950">TAP !</span>
            </button>
        </div>

        <!-- Score & Stats -->
        <div class="w-full bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex justify-around">
            <div>
                <span class="text-xs text-gray-400">Score</span>
                <div id="scoreDisplay" class="text-lg font-bold text-cyan-400">0</div>
            </div>
            <div class="border-r border-slate-800"></div>
            <div>
                <span class="text-xs text-gray-400">Parrainage</span>
                <button id="referralBtn" class="text-xs text-cyan-300 underline block mt-1">Inviter des amis</button>
            </div>
        </div>

        <!-- Bouton Paiement / Dépôt -->
        <button id="payButton" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg transition">
            ACTIVER / PAYER (Crypto)
        </button>
    </main>

    <!-- FOOTER / CHAT OU INFOS -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-gray-500 border-t border-slate-800">
        Miltape World Challenge &copy; 2026 - Tous droits réservés
    </footer>

    <!-- LOGIQUE JAVASCRIPT TECHNIQUE -->
    <script>
        // URL de ton backend sur Railway (à remplacer par ton URL publique finale)
        const BACKEND_URL = "https://miltape-backend-production.up.railway.app";

        let playerData = {
            username: localStorage.getItem('miltape_username') || '',
            score: 0,
            wallet: null
        };

        // Gestion de la modale de pseudo initiale
        const nameModal = document.getElementById('nameModal');
        const usernameInput = document.getElementById('usernameInput');
        const saveNameBtn = document.getElementById('saveNameBtn');

        if (playerData.username) {
            nameModal.classList.add('hidden');
        }

        saveNameBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name.length >= 2) {
                playerData.username = name;
                localStorage.setItem('miltape_username', name);
                nameModal.classList.add('hidden');
                initSession();
            } else {
                alert("Entre un pseudo valide (2 caractères min).");
            }
        });

        // Gestion des modales Wallet
        const walletModal = document.getElementById('walletModal');
        document.getElementById('openWalletModal').addEventListener('click', () => walletModal.classList.remove('hidden'));
        document.getElementById('closeWalletBtn').addEventListener('click', () => walletModal.classList.add('hidden'));

        // Logique de jeu (Tap + Anti-bot / PoW simulé)
        const tapButton = document.getElementById('tapButton');
        const scoreDisplay = document.getElementById('scoreDisplay');

        tapButton.addEventListener('click', () => {
            playerData.score++;
            scoreDisplay.textContent = playerData.score;

            // Envoi de la donnée au serveur Railway (WebSockets ou fetch POST)
            sendTapToServer(playerData.score);
        });

        function initSession() {
            // Appel initial pour enregistrer / récupérer la session HttpOnly du joueur
            fetch(`${BACKEND_URL}/api/join`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: playerData.username })
            })
            .then(res => res.json())
            .then(data => console.log("Session initialisée", data))
            .catch(err => console.error("Erreur connexion serveur:", err));
        }

        function sendTapToServer(score) {
            // Exemple d'envoi sécurisé vers le backend Railway
            fetch(`${BACKEND_URL}/api/tap`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score, timestamp: Date.now() })
            }).catch(err => console.error("Erreur sync tap:", err));
        }

        // Bouton de paiement (Cryptomus / NOWPayments)
        document.getElementById('payButton').addEventListener('click', () => {
            alert("Redirection vers la passerelle de paiement sécurisée...");
            // Logique d'appel de l'API de paiement
        });
    </script>
</body>
</html>
