<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Test Connexion</h1>
    <input type="text" id="pseudo" placeholder="Pseudo">
    <button onclick="testerClic()">VALIDER</button>

    <script>
        // On force l'utilisation des WebSockets purs pour éviter les blocages de Railway
        const socket = io({
            transports: ['websocket']
        });

        socket.on('connect', () => {
            console.log("Connecté ! ID:", socket.id);
        });

        socket.on('connect_error', (err) => {
            alert("Erreur de connexion serveur : " + err.message);
        });

        function testerClic() {
            const p = document.getElementById('pseudo').value;
            alert("Envoi au serveur du pseudo : " + p);
            socket.emit('setPseudo', p);
        }

        socket.on('pseudoAccepted', () => {
            alert("Succès ! Le serveur a validé.");
        });
    </script>
</body>
</html>
