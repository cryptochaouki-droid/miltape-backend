<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILTAPE - VIP Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05020a;
            --panel-bg: rgba(18, 13, 38, 0.6);
            --panel-border: rgba(69, 50, 117, 0.5);
            --gold-base: #ffcc00;
            --neon-green: #00ff66;
            --neon-blue: #00d2ff;
            --neon-purple: #b535ff;
            --neon-orange: #ff6a00;
            --text-main: #ffffff;
            --text-muted: #8e85b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 27, 128, 0.4) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(255, 106, 0, 0.15) 0%, transparent 50%);
        }

        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="1" fill="white" opacity="0.3"/><circle cx="150" cy="40" r="1.5" fill="white" opacity="0.5"/><circle cx="80" cy="120" r="1" fill="white" opacity="0.2"/><circle cx="190" cy="180" r="2" fill="white" opacity="0.4"/></svg>') repeat; animation: drift 60s linear infinite; }
        @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-100vh); } }

        .app { width: 100%; max-width: 420px; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; position: relative; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--panel-border); border-radius: 25px; padding: 6px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg, #1a1a2e, #16213e); border: 2px solid var(--gold-base); display: flex; align-items: center; justify-content: center; }
        .online-dot { color: var(--neon-green); font-size: 0.65rem; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .online-dot::before { content: ''; display: block; width: 6px; height: 6px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); } }

        .hero { text-align: center; margin-top: 20px; }
        .title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 3.2rem; background: linear-gradient(180deg, #fffde4 0%, #ffcc00 45%, #b35900 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; transform: skewX(-5deg); }
        
        .bets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .bet-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px 4px; text-align: center; cursor: pointer; color: var(--text-muted); }
        .bet-card.active { border-color: var(--neon-blue); color: #fff; background: rgba(255,255,255,0.03); }

        .play-btn { width: 100%; background: linear-gradient(180deg, #ffde00 0%, #ff8800 100%); border: none; padding: 16px; border-radius: 30px; font-weight: 900; font-family: 'Montserrat'; cursor: pointer; }
        
        #game-area { text-align: center; display: none; }
        #btn-tap { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #ff5e62 0%, #ff9966 100%); border: 6px solid #fff; font-size: 2rem; color: #fff; margin: 20px auto; cursor: pointer; }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="app">
        <header class="top-bar">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="avatar">👑</div>
                <div>
                    <h1 id="user-display-name" style="font-size: 0.8rem;">MILTAPER</h1>
                    <div class="online-dot" id="online-count">0 EN LIGNE</div>
                </div>
            </div>
        </header>

        <div id="login-area">
            <section class="hero">
                <h1 class="title">MILTAPE</h1>
                <p>WORLD CHALLENGE</p>
            </section>

            <input type="text" id="pseudo" class="bet-card" style="width:100%; margin: 10px 0; background:rgba(0,0,0,0.5); text-align:center;" placeholder="Ton pseudo...">
            
            <div class="bets-grid" style="margin-top:10px;">
                <div class="bet-card active" onclick="selectBet(this)">1€</div>
                <div class="bet-card" onclick="selectBet(this)">5€</div>
                <div class="bet-card" onclick="selectBet(this)">10€</div>
                <div class="bet-card" onclick="selectBet(this)">20€</div>
            </div>

            <button class="play-btn" style="margin-top:20px;" onclick="lancerJeu()">JOUER MAINTENANT</button>
        </div>

        <div id="game-area">
            <div id="timer" style="font-size:3rem; font-weight:900;">10:00</div>
            <div id="score" style="font-size:2rem; font-weight:900;">0</div>
            <button id="btn-tap" onclick="tap()">TAP !</button>
        </div>
    </div>

    <script>
        const socket = io();

        // Compteur réel
        socket.on('playerCountUpdate', (count) => {
            document.getElementById('online-count').innerText = count + " EN LIGNE";
        });

        function selectBet(el) {
            document.querySelectorAll('.bet-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function lancerJeu() {
            const pseudo = document.getElementById('pseudo').value || "Joueur";
            socket.emit('setPseudo', pseudo);
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            socket.emit('joinQueue');
        }

        function tap() { socket.emit('playerTap'); }

        socket.on('scoreUpdated', (s) => { document.getElementById('score').innerText = s; });
        socket.on('startTournament', (data) => { /* Logique chrono ici */ });
        socket.on('tournamentResults', (results) => { alert("Fin du tournoi !"); location.reload(); });
    </script>
</body>
</html>
