  <script>
    (function initTelegramWebApp() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          const w = window.Telegram.WebApp;
          w.expand();
          try {
            if (w.version && parseFloat(w.version) >= 6.1) {
              w.BackButton.show();
              w.BackButton.onClick(function() { w.close(); });
            }
          } catch (e) { console.warn("⚠️ BackButton non supporté:", e); }
          if (w.colorScheme) document.body.setAttribute('data-telegram-theme', w.colorScheme);
        }
      } catch (e) { console.warn("⚠️ Erreur init Telegram:", e); }
    })();
  </script>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  
  <style>

<body>

  <!-- SCRIPTS -->
  <script>
    const BACKEND_URL = 'https://miltape-backend-production.up.railway.app';
    const socket = io(BACKEND_URL, { transports: ['websocket', 'polling'], reconnection: true });

    // Éléments DOM
    const tapButton = document.getElementById('tapButton');
    const tapCounterDisplay = document.getElementById('tapCounterDisplay');
    const enterChallenge = document.getElementById('enterChallenge');
    const payButton = document.getElementById('payButton');
    const duelButton = document.getElementById('duelButton');
    const onlineCount = document.getElementById('onlineCount');
    const timerRuleValue = document.getElementById('timerRuleValue');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    // État
    let isPlaying = false, isPaid = false, gameStatus = 'waiting';
    let myPlayerId = null, myName = '', myTaps = 0;
    let lastTapTime = 0; // Anti-triche client : Intervalle minimum entre taps
    const TAP_COOLDOWN_MS = 120; 

    // Fonctions Haptiques
    function hapticLight() { try { window.Telegram.WebApp.HapticFeedback.impactOccurred('light'); } catch(e) {} }

    // Notifications
    function showToast(message, type = 'info') {
      const container = document.getElementById('notificationContainer');
      const notif = document.createElement('div');
      notif.className = 'notification ' + type;
      notif.textContent = message; // textContent évite l'injection XSS
      container.appendChild(notif);
      setTimeout(() => { if (notif.parentNode) notif.remove(); }, 4000);
    }

    // Sécurité : Validation du pseudo (Longueur stricte, pas de caractères spéciaux)
    function sanitizeName(name) {
      return name.replace(/[<>"'`]/g, '').trim().substring(0, 20);
    }

    // Sécurité : Validation de l'adresse Tron
    function isValidTronAddress(addr) {
      return /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr);
    }

    // Génération ID sécurisé
    function getOrCreateDeviceId() {
      let id = localStorage.getItem('miltape_device_id');
      if (id) return id;
      id = (window.crypto?.randomUUID) ? crypto.randomUUID() : 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('miltape_device_id', id);
      return id;
    }
    const MY_DEVICE_ID = getOrCreateDeviceId();

    // ============================================================
    // SOCKET EVENTS (Récupération sécurisée des données)
    // ============================================================
    socket.on('connect', () => { socket.emit('timer:request'); restoreSession(); });
    
    socket.on('timer:update', (data) => {
      if (timerRuleValue) {
        const m = Math.floor(data.remainingSeconds / 60);
        const s = data.remainingSeconds % 60;
        timerRuleValue.textContent = m + ':' + s.toString().padStart(2, '0');
      }
      gameStatus = data.status;
      if (data.status === 'running' && isPaid) tapButton.disabled = false;
      else tapButton.disabled = true;
    });

    socket.on('leaderboard:update', (leaderboard) => {
      const list = document.getElementById('leaderboardList');
      list.innerHTML = '';
      if (!leaderboard || leaderboard.length === 0) {
        list.innerHTML = '<div class="empty-ranking">Aucun joueur</div>';
        return;
      }
      leaderboard.forEach(player => {
        const div = document.createElement('div');
        div.className = 'leaderboard-item';
        // Utilisation de textContent pour éviter le XSS
        const nameSpan = document.createElement('span');
        nameSpan.className = 'player-name';
        nameSpan.textContent = player.name;
        
        const scoreSpan = document.createElement('span');
        scoreSpan.className = 'player-score';
        scoreSpan.textContent = player.taps;

        div.appendChild(nameSpan);
        div.appendChild(scoreSpan);
        list.appendChild(div);
      });
    });

    socket.on('player:score', (data) => { myTaps = data.taps; tapCounterDisplay.textContent = myTaps; });

    socket.on('chat:message', (data) => {
      const div = document.createElement('div');
      div.className = 'chat-message';
      // textContent est CRUCIAL ici pour bloquer toute injection de script malveillant
      const strong = document.createElement('strong');
      strong.textContent = data.name + " : ";
      div.appendChild(strong);
      div.appendChild(document.createTextNode(data.message));
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    socket.on('totalStakes:update', (data) => {
      document.getElementById('displayBet').textContent = data.totalStakes + ' USDT';
    });

    socket.on('jackpot:update', (data) => {
      document.getElementById('jackpotAmount').textContent = data.prize + ' USDT';
      document.getElementById('jackpotCountdown').textContent = data.nextDraw ? new Date(data.nextDraw).toLocaleTimeString() : '--';
    });

    socket.on('player:joined', (data) => {
      if (data.success) {
        isPlaying = true; myPlayerId = data.player.id; myName = data.player.name;
        enterChallenge.style.display = 'none';
        if (demoMode) {
          isPaid = true;
          showToast('🔬 Mode démo actif', 'info');
          fetch(BACKEND_URL + '/api/demo/verify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ playerId: myPlayerId }) }).catch(console.error);
        } else {
          payButton.style.display = 'block';
          payButton.onclick = () => initiatePayment(data.player.wallet, data.player.bet);
        }
      }
    });

    socket.on('payment:verified', () => { isPaid = true; payButton.style.display = 'none'; tapButton.disabled = false; showToast('✅ Paiement vérifié !', 'success'); });

    // ============================================================
    // ACTIONS
    // ============================================================

    // ANTI-TRICHE : Empêche le spam de clics avec temporisation locale
    if (tapButton) {
      tapButton.addEventListener('click', function() {
        const now = Date.now();
        if (now - lastTapTime < TAP_COOLDOWN_MS) return;
        lastTapTime = now;

        if (gameStatus !== 'running' || !isPaid) return;
        socket.emit('player:tap');
        hapticLight();
      });
    }

    // Rejoindre le jeu
    function joinGame() {
      const telegramUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
      let name = telegramUser?.username || telegramUser?.first_name || '';
      
      if (!name || name.length < 2) {
        name = prompt("Entre ton pseudo (min 2 caractères) :");
        if (!name) return;
        name = sanitizeName(name);
      }

      if (demoMode) {
        proceedJoin(name, 'DEMO_' + MY_DEVICE_ID);
      } else {
        let wallet = prompt("💰 Entre ton adresse TRON (commence par T) :");
        if (!wallet) return;
        wallet = wallet.trim();
        if (!isValidTronAddress(wallet)) {
          showToast("❌ Adresse TRON invalide !", 'error');
          return;
        }
        proceedJoin(name, wallet);
      }
    }

    function proceedJoin(name, wallet) {
      const token = localStorage.getItem('miltape_session_token');
      socket.emit('player:join', { name, wallet, bet: 10, token: 'USDT', deviceId: MY_DEVICE_ID, sessionToken: token });
    }

    // Paiement sécurisé (sans prompt utilisateur non sécurisé)
    function initiatePayment(wallet, amount) {
      fetch(BACKEND_URL + '/api/wallet')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const serverWallet = data.wallet;
            // Ouverture du wallet Telegram (Le serveur vérifiera la tx côté blockchain)
            window.open('https://t.me/wallet?start=transfer-' + serverWallet + '-' + amount + '-USDT', '_blank');
            showToast('💰 Envoie ' + amount + ' USDT vers le wallet affiché !', 'info');
          } else showToast('❌ Impossible de récupérer le wallet', 'error');
        })
        .catch(() => showToast('❌ Erreur réseau', 'error'));
    }

    function restoreSession() {
      const token = localStorage.getItem('miltape_session_token');
      if (token) socket.emit('player:restore', { sessionToken: token });
    }

    // ============================================================
    // UI EVENTS
    // ============================================================
    document.getElementById('welcomeCloseBtn').addEventListener('click', () => document.getElementById('welcomeModal').classList.remove('show'));
    document.getElementById('menuButton').addEventListener('click', () => { document.getElementById('sideMenu').classList.add('show'); document.getElementById('menuOverlay').classList.add('show'); });
    document.getElementById('closeMenu').addEventListener('click', () => { document.getElementById('sideMenu').classList.remove('show'); document.getElementById('menuOverlay').classList.remove('show'); });
    document.getElementById('menuOverlay').addEventListener('click', () => { document.getElementById('sideMenu').classList.remove('show'); document.getElementById('menuOverlay').classList.remove('show'); });
    document.getElementById('resetGameBtn').addEventListener('click', () => { if(confirm('Réinitialiser ?')) { localStorage.clear(); location.reload(); } });

    document.getElementById('chatSend').addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      socket.emit('chat:send', { message: text.substring(0, 200) });
      chatInput.value = '';
    }

    // Initialisation
    enterChallenge.addEventListener('click', joinGame);
    duelButton.addEventListener('click', () => socket.emit('duel:join', { bet: 1 }));
    
    // Récupérer l'adresse du serveur proprement (plus de hardcode)
    fetch(BACKEND_URL + '/api/wallet')
      .then(r => r.json())
      .then(data => { if(data.success) document.getElementById('serverWalletDisplay').textContent = data.wallet; })
      .catch(() => document.getElementById('serverWalletDisplay').textContent = 'Erreur de chargement');
  </script>
</body>
</html>
