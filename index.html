<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILTAPE WORLD CHALLENGE</title>
    <style>
        :root {
            --bg-deep: #050b18;
            --bg-card: rgba(13, 27, 62, 0.7);
            --border-glow: rgba(0, 243, 255, 0.3);
            --accent-cyan: #00f3ff;
            --accent-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            position: relative;
        }

        /* HEADER & LOGO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .wallet-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* BANNIÈRE */
        .banner {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(13, 27, 62, 0.8));
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        /* ========================================================== */
        /* SECTION JACKPOT — AMÉLIORATION VISUELLE UNIQUE & PREMIUM   */
        /* ========================================================== */
        .jackpot-card {
            background: linear-gradient(145deg, rgba(18, 35, 75, 0.85), rgba(8, 17, 38, 0.95));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: jackpotBreathe 4s ease-in-out infinite;
        }

        /* Reflet lumineux fin en diagonale */
        .jackpot-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 45%,
                rgba(255, 255, 255, 0.04) 50%,
                transparent 55%
            );
            transform: rotate(25deg);
            pointer-events: none;
        }

        .jackpot-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .jackpot-amount {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 20%, #ffe600 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            position: relative;
            display: inline-block;
        }

        @keyframes jackpotBreathe {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 215, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 215, 0, 0.4);
            }
            50% {
                box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 215, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
                border-color: rgba(255, 215, 0, 0.7);
            }
        }
        /* ========================================================== */

        /* CHRONOMÈTRE */
        .timer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .timer-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* SECTION TAP / JOUER */
        .tap-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            flex-grow: 1;
        }

        .tap-button {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), #0077ff);
            border: none;
            color: #050b18;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .tap-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }

        /* MODE DUEL & MISE */
        .duel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .duel-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .duel-action {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        /* ACTION PRINCIPALE */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #050b18;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.3);
        }

        /* CLASSEMENT & CHAT */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* MENU / NAVIGATION BASSE */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(8, 17, 38, 0.9);
            border-top: 1px solid var(--border-glow);
            padding: 12px 0;
            margin-top: auto;
            border-radius: 12px 12px 0 0;
        }

        .nav-item {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="logo-container">
                <span class="logo-icon">👑</span>
                <span class="logo-text">MILTAPE</span>
            </div>
            <div class="wallet-badge">
                <span>💎</span> <span id="tron-balance">1,250.00 TRON</span>
            </div>
        </header>

        <!-- BANNIÈRE -->
        <div class="banner">
            World Challenge Live • Saisons & Duels
        </div>

        <!-- CARTE JACKPOT (VISUEL AMÉLIORÉ) -->
        <div class="jackpot-card">
            <div class="jackpot-title">
                <span>👑</span> Jackpot Mondial
            </div>
            <div class="jackpot-amount" id="jackpot-display">
                15,480.50 TRON
            </div>
        </div>

        <!-- CHRONOMÈTRE -->
        <div class="timer-card">
            <div>Fin de la manche dans</div>
            <div class="timer-value" id="timer-display">02:45:10</div>
        </div>

        <!-- SECTION TAP -->
        <div class="tap-section">
            <button class="tap-button" id="tap-btn">TAP</button>
        </div>

        <!-- MODE DUEL & MISE -->
        <div class="duel-card">
            <span class="duel-title">Mode Duel / Mise</span>
            <span class="duel-action">100 TRON</span>
        </div>

        <!-- JOUER MAINTENANT -->
        <button class="action-btn" id="play-now-btn">Jouer Maintenant</button>

        <!-- CLASSEMENT & CHAT -->
        <div class="info-grid">
            <div class="info-card" id=" classement-btn">Classement</div>
            <div class="info-card" id="chat-btn">Chat Global</div>
        </div>

        <!-- MENU / NAVIGATION -->
        <nav class="bottom-nav">
            <span class="nav-item active">Accueil</span>
            <span class="nav-item">Duels</span>
            <span class="nav-item">Classement</span>
            <span class="nav-item">Wallet</span>
        </nav>
    </div>

    <!-- SOCKET.IO & LOGIQUE BACKEND EXISTANTE -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Connexion Socket.IO et logique inchangée
        const socket = io();

        socket.on('connect', () => {
            console.log('Connecté au serveur WebSocket backend');
        });

        // Mise à jour de la source du Jackpot (logique d'origine préservée à l'identique)
        socket.on('jackpot_update', (data) => {
            if (data && data.amount) {
                document.getElementById('jackpot-display').innerText = data.amount + ' TRON';
            }
        });

        socket.on('balance_update', (data) => {
            if (data && data.balance) {
                document.getElementById('tron-balance').innerText = data.balance + ' TRON';
            }
        });

        // Interactions de base
        document.getElementById('tap-btn').addEventListener('click', () => {
            socket.emit('player_tap', { timestamp: Date.now() });
        });

        document.getElementById('play-now-btn').addEventListener('click', () => {
            socket.emit('play_now_action');
        });
    </script>
</body>
</html>
