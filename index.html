<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MILTAPE - Tournoi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; }
        #game-area { display: none; }
        #btn-tap { width: 200px; height: 200px; border-radius: 50%; font-size: 24px; cursor: pointer; }
        #timer { font-size: 30px; color: #ffeb3b; }
    </style>
</head>
<body>

    <div id="login-area">
        <input type="text" id="pseudo" placeholder="Ton pseudo...">
        <button onclick="setPseudo()">Valider</button>
    </div>

    <div id="queue-area" style="display:none;">
        <p>En attente de joueurs... (<span id="queue-count">0</span>/5)</p>
    </div>

    <div id="game-area">
        <div id="timer">10:00</div>
        <h1>Score : <span id="score">0</span></h1>
        <button id="btn-tap" onclick="tap()">TAP !</button>
    </div>

    <script>
        const socket = io();
        let gameActive = false;

        function setPseudo() {
            const p = document.getElementById('pseudo').value;
            socket.emit('setPseudo', p);
        }

        socket.on('pseudoAccepted', () => {
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('queue-area').style.display = 'block';
            socket.emit('joinQueue');
        });

        socket.on('startTournament', (data) => {
            document.getElementById('queue-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            gameActive = true;
            startTimer(data.duration);
        });

        function tap() {
            if(gameActive) socket.emit('playerTap');
        }

        socket.on('scoreUpdated', (s) => {
            document.getElementById('score').innerText = s;
        });

        function startTimer(duration) {
            let timer = duration / 1000;
            const display = document.getElementById('timer');
            let interval = setInterval(() => {
                let m = Math.floor(timer / 60);
                let s = timer % 60;
                display.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (--timer < 0) {
                    clearInterval(interval);
                    gameActive = false;
                    alert("Tournoi terminé !");
                }
            }, 1000);
        }
    </script>
</body>
</html>
