<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d47a1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Miltape World Challenge — Tape, classe-toi, gagne." />
  <title>Miltape World Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192~2.jpg" />
  <link rel="icon" href="./icon-192~2.jpg" type="image/jpeg" />
  
  <!-- 1. Script Telegram sécurisé -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function initTelegramWebApp() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          const w = window.Telegram.WebApp;
          w.expand();
          try {
            if (w.version && parseFloat(w.version) >= 6.1) {
              w.BackButton.show();
              w.BackButton.onClick(function() { w.close(); });
            }
          } catch (e) { console.warn("⚠️ BackButton non supporté:", e); }
          
          if (w.colorScheme) document.body.setAttribute('data-telegram-theme', w.colorScheme);
        }
      } catch (e) { console.warn("⚠️ Erreur init Telegram:", e); }
    })();
  </script>

  <!-- ===== DÉSACTIVATION FORCÉE DU CACHE ===== -->
  <script>
    if ('caches' in window) {
        caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
        });
    }
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) { registration.unregister(); }
        });
    }
  </script>
  
  <!-- 2. CDN Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  
  <style>
    /* ===== FOND BLEU SAPHIR HD ===== */
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(ellipse at 40% 30%, #1a6fb5 0%, #0d47a1 35%, #0a2a5c 65%, #051230 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    body::before { content: ""; position: fixed; top: -20%; right: -10%; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(100, 180, 255, 0.12), transparent 60%); pointer-events: none; z-index: 0; animation: hdGlow1 7s ease-in-out infinite alternate; }
    body::after { content: ""; position: fixed; bottom: -20%; left: -10%; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(50, 120, 255, 0.08), transparent 60%); pointer-events: none; z-index: 0; animation: hdGlow2 9s ease-in-out infinite alternate; }
    @keyframes hdGlow1 { 0% { transform: translate(0, 0) scale(1); opacity: .5; } 100% { transform: translate(-40px, 30px) scale(1.3); opacity: 1; } }
    @keyframes hdGlow2 { 0% { transform: translate(0, 0) scale(1); opacity: .3; } 100% { transform: translate(30px, -40px) scale(1.4); opacity: .8; } }
    
    .gem-sparkle { position: fixed; width: 4px; height: 4px; background: #64b5f6; border-radius: 50%; pointer-events: none; z-index: 0; box-shadow: 0 0 12px rgba(100, 181, 246, .4); animation: sparkleFloatHD 5s ease-in-out infinite alternate; }
    .gem-sparkle:nth-child(1) { top: 8%; left: 12%; animation-delay: 0s; }
    .gem-sparkle:nth-child(2) { top: 25%; left: 85%; animation-delay: 1.4s; width: 6px; height: 6px; }
    .gem-sparkle:nth-child(3) { top: 55%; left: 8%; animation-delay: 2.8s; }
    .gem-sparkle:nth-child(4) { top: 75%; left: 75%; animation-delay: .9s; width: 5px; height: 5px; }
    .gem-sparkle:nth-child(5) { top: 40%; left: 55%; animation-delay: 2s; width: 8px; height: 8px; }
    @keyframes sparkleFloatHD { 0% { transform: translate(0, 0) scale(.7); opacity: .15; } 100% { transform: translate(12px, -18px) scale(1.6); opacity: 1; } }
    
    .app { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; padding-bottom: 80px; position: relative; z-index: 1; animation: fadeIn .6s ease-out; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
    .glass-card { background: rgba(255, 255, 255, .10); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 8px 32px rgba(0, 0, 0, .3); border-radius: 20px; }
    
    #ton-connect-button, div[id^="tc-widget"], iframe[id^="tc-widget"], .tc-connect-button { display: none !important; }
    html { width: 100%; min-height: 100%; overflow-x: hidden; overflow-y: scroll; scroll-behavior: smooth; }
    
    .hero-banner-container { position: relative; width: calc(100% - 24px); margin: 8px 12px 10px; overflow: hidden; background: rgba(255, 255, 255, .06); backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, .10); }
    .hero-bg-image { width: 100%; display: block; height: auto; opacity: .7; mix-blend-mode: screen; }
    
    .side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background: rgba(5, 18, 48, .96); backdrop-filter: blur(20px); border-right: 1px solid rgba(100, 181, 246, .15); z-index: 1000; transition: left .3s ease; padding: 20px; box-sizing: border-box; overflow-y: auto; color: #e0e0e0; }
    .side-menu.show { left: 0; }
    .close-menu { background: 0 0; border: none; color: #e0e0e0; font-size: 28px; cursor: pointer; }
    .side-menu-content { margin-top: 40px; padding-bottom: 30px; }
    .side-menu-content h3 { color: #64b5f6; margin-bottom: 20px; font-size: 16px; letter-spacing: 1px; }
    .menu-block { margin-bottom: 15px; background: rgba(255, 255, 255, .03); padding: 12px; border-radius: 10px; }
    .menu-block label, .menu-block h4 { display: block; font-size: 13px; color: #64b5f6; margin-bottom: 8px; font-weight: 700; }
    .menu-block select { width: 100%; padding: 8px; border-radius: 6px; background: #0a2a5c; color: #e0e0e0; border: 1px solid rgba(100, 181, 246, .2); font-family: 'Poppins', sans-serif; font-size: 12px; }
    .menu-nav-btn { display: block; width: 100%; background: 0 0; border: none; color: #e0e0e0; text-align: left; font-size: 14px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; border-radius: 8px; font-family: 'Poppins', sans-serif; transition: all .2s ease; }
    .menu-nav-btn:hover { background: rgba(100, 181, 246, .12); color: #64b5f6; }
    .menu-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; z-index: 999; }
    .menu-overlay.show { display: block; }

    /* ===== CHRONOMÈTRE & ZONE TAP ===== */
    .tap-zone { width: 100%; min-height: 280px; display: flex; align-items: center; justify-content: center; position: relative; padding: 16px 0; flex-direction: column; }
    .tap-zone #timerRule { 
      position: relative; margin-bottom: 20px; z-index: 20; 
      background: rgba(13, 35, 75, 0.85); backdrop-filter: blur(12px); 
      border: 1px solid rgba(0, 243, 255, 0.35); box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); 
      border-radius: 14px; padding: 8px 18px; display: flex !important; align-items: center; gap: 12px; white-space: nowrap; 
    }
    .tap-zone #timerRule strong { font-size: clamp(20px, 4.5vw, 26px); color: #00f3ff !important; text-shadow: 0 0 12px rgba(0, 243, 255, 0.7); font-family: 'Orbitron', sans-serif; }
    .tap-zone #timerRule.warning { border-color: rgba(255, 51, 102, 0.6); box-shadow: 0 0 25px rgba(255, 51, 102, 0.5); animation: pulseTimerCard 1.5s infinite ease-in-out; }
    .tap-zone #timerRule.warning strong { color: #ff3366 !important; text-shadow: 0 0 15px rgba(255, 51, 102, 0.9); }
    @keyframes pulseTimerCard { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

    .tap-button {
      position: relative; width: clamp(215px, 56vw, 315px); height: clamp(215px, 56vw, 315px);
      border: 3.5px solid rgba(100, 181, 246, 0.8); border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(100, 181, 246, 0.4), rgba(255, 255, 255, 0.12));
      box-shadow: 0 0 60px rgba(100, 181, 246, 0.45), inset 0 0 70px rgba(100, 181, 246, 0.25);
      cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 8px auto; outline: 0;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }
    .tap-button.disabled { opacity: 0.5; filter: grayscale(80%); pointer-events: none; cursor: not-allowed; }
    .tap-img-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; opacity: .95; }

    /* ========================================================================= */
    /* 🚀 BOUTON REJOUER & ÉTAT DE CHARGEMENT                                    */
    /* ========================================================================= */
    .main-play-button {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 80%; max-width: 280px; margin: 12px auto; padding: 12px 18px;
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: #fff; border: none;
      font-size: clamp(14px, 3.5vw, 18px); font-weight: 900; font-family: 'Poppins', sans-serif; cursor: pointer;
      box-shadow: 0 6px 0 #990000, 0 8px 24px rgba(255, 65, 108, 0.5); border-radius: 18px; text-transform: uppercase;
      transition: all 0.25s ease; position: relative;
    }
    .main-play-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 #990000, 0 10px 28px rgba(255, 65, 108, 0.7); }
    .main-play-button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 4px 0 #990000, 0 4px 16px rgba(255, 65, 108, 0.5); }
    
    /* État de chargement (loading) du bouton REJOUER */
    .main-play-button.loading {
      opacity: 0.75;
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: 0 4px 0 #660000, 0 4px 12px rgba(255, 65, 108, 0.3);
    }

    /* Spinner animé élégant */
    .btn-spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: btnSpin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes btnSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Message d'erreur discret */
    .error-toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(255, 51, 102, 0.95); backdrop-filter: blur(10px); color: #fff;
      padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 25px rgba(255, 51, 102, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10000; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ========================================================================= */
    /* 🎬 EFFET DE FIN DE PARTIE & TRANSITION                                   */
    /* ========================================================================= */
    .game-over-overlay {
      position: fixed; inset: 0; background: rgba(5, 18, 48, 0.85); backdrop-filter: blur(8px);
      z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .game-over-overlay.active { opacity: 1; pointer-events: auto; animation: flashOverlay 0.8s ease-out forwards; }
    @keyframes flashOverlay {
      0% { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
      30% { background: rgba(10, 42, 92, 0.95); backdrop-filter: blur(10px); }
      100% { background: rgba(5, 18, 48, 0.85); backdrop-filter: blur(8px); }
    }

    .game-over-title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(22px, 6vw, 32px); font-weight: 900;
      color: #00f3ff; text-transform: uppercase; letter-spacing: 2px; text-align: center;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
      transform: scale(0.8); opacity: 0; animation: zoomInTitle 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
    }
    @keyframes zoomInTitle {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .end-particle { position: absolute; width: 6px; height: 6px; background: #00f3ff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px #00f3ff; animation: particleBurst 0.8s ease-out forwards; }
    @keyframes particleBurst {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
    }

    /* ========================================================================= */
    /* 🏆 NOUVEAU DESIGN DU CLASSEMENT TOP 5 & HIÉRARCHIE VISUELLE               */
    /* ========================================================================= */
    .leaderboard {
      background: rgba(13, 35, 75, 0.88) !important;
      backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(100, 181, 246, 0.3) !important;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5) !important;
      border-radius: 20px !important;
      padding: 16px !important;
      position: relative;
      margin-bottom: 12px;
    }
    .leaderboard .section-title {
      color: #fff !important; font-size: 14px !important; letter-spacing: 1px !important;
      margin-bottom: 12px !important; font-weight: 900 !important; font-family: 'Orbitron', sans-serif !important;
      display: flex; align-items: center; justify-content: space-between;
    }
    
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Classes d'apparition séquentielle pour les cartes */
    .rank-card-animated {
      opacity: 0;
      transform: translateY(20px) scale(0.97);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .rank-card-animated.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* --- 🥇 CARTE 1ÈRE PLACE (Dominante & Podium) --- */
    .rank-card-1 {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.18) 0%, rgba(255, 255, 255, 0.08) 100%) !important;
      border: 2px solid rgba(255, 215, 0, 0.8) !important;
      border-radius: 16px !important;
      padding: 14px 16px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.35), inset 0 0 12px rgba(255, 215, 0, 0.2) !important;
      position: relative;
    }
    .rank-card-1.show { animation: goldGlow 3s ease-in-out infinite alternate; }
    .rank-card-1::before {
      content: '👑'; position: absolute; top: -10px; right: 14px; font-size: 18px; filter: drop-shadow(0 0 6px rgba(255,215,0,0.8));
    }
    @keyframes goldGlow {
      0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.15); }
      100% { box-shadow: 0 0 35px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.3); }
    }

    /* --- 🥈 2E & 🥉 3E PLACES (Podium Secondaire) --- */
    .rank-card-2, .rank-card-3 {
      background: rgba(255, 255, 255, 0.07) !important;
      border-radius: 14px !important;
      padding: 10px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      border: 1px solid rgba(100, 181, 246, 0.25);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .rank-card-2 { border-left: 4px solid #c0c0c0 !important; }
    .rank-card-3 { border-left: 4px solid #cd7f32 !important; }

    /* --- 4E & 5E PLACES (Lignes Compactes) --- */
    .rank-card-compact {
      background: rgba(255, 255, 255, 0.04) !important;
      border-radius: 10px !important;
      padding: 8px 12px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px !important;
    }

    /* Éléments internes des cartes de classement */
    .rank-left { display: flex; align-items: center; gap: 10px; }
    .rank-badge-styled {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 900;
      font-family: 'Orbitron', sans-serif; color: #fff;
    }
    .rank-card-1 .rank-badge-styled { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.6); }
    .rank-card-2 .rank-badge-styled { background: linear-gradient(135deg, #e0e0e0, #9e9e9e); color: #000; }
    .rank-card-3 .rank-badge-styled { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; }
    .rank-card-compact .rank-badge-styled { width: 22px; height: 22px; font-size: 10px; background: rgba(100, 181, 246, 0.2); color: #64b5f6; }

    .player-details { display: flex; flex-direction: column; }
    .player-name-text { font-weight: 700; color: #fff; font-family: 'Poppins', sans-serif; }
    .rank-card-1 .player-name-text { font-size: 15px; color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.4); }
    .rank-card-2 .player-name-text, .rank-card-3 .player-name-text { font-size: 13px; }
    .rank-card-compact .player-name-text { font-size: 12px; }

    .player-taps-text { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600; font-family: 'Orbitron', sans-serif; }

    .player-gain-text {
      font-family: 'Orbitron', sans-serif; font-weight: 900; color: #2ecc71; text-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
      text-align: right;
    }
    .rank-card-1 .player-gain-text { font-size: 15px; }
    .rank-card-2 .player-gain-text, .rank-card-3 .player-gain-text { font-size: 13px; }
    .rank-card-compact .player-gain-text { font-size: 11px; }

    /* --- CARTE "VOTRE POSITION" (Si hors du Top 5) --- */
    .your-position-separator {
      height: 1px; width: 100%; background: linear-gradient(90deg, transparent, rgba(100, 181, 246, 0.4), transparent);
      margin: 12px 0 8px 0;
    }
    .your-position-card {
      background: rgba(100, 181, 246, 0.12) !important;
      border: 1.5px dashed #64b5f6 !important;
      border-radius: 12px !important;
      padding: 10px 14px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      box-shadow: 0 0 15px rgba(100, 181, 246, 0.2);
    }
    .your-position-card .player-name-text { color: #64b5f6; }

    /* Highlight si le joueur est DANS le Top 5 */
    .user-in-top {
      border-color: #00f3ff !important;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4) !important;
      background: rgba(0, 243, 255, 0.08) !important;
    }

    /* ========================================================================= */

    .chat-section {
      background: rgba(13, 35, 75, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(100, 181, 246, 0.25) !important;
      border-radius: 18px !important; padding: 12px !important;
    }
    .chat-messages {
      background: rgba(5, 15, 35, 0.6) !important; border: 1px solid rgba(100, 181, 246, 0.15) !important;
      border-radius: 12px !important; padding: 8px !important; height: 110px !important;
      overflow-y: auto !important; display: flex !important; flex-direction: column !important; margin-bottom: 8px !important;
    }
    .chat-message { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; font-size: 12px; padding: 6px 10px; border-radius: 10px; margin-bottom: 5px; }
    .chat-input-box { background: rgba(5, 15, 35, 0.7); border-radius: 12px; padding: 4px 6px; display: flex; align-items: center; border: 1px solid rgba(100, 181, 246, 0.25); }
    .chat-input-box input { flex: 1; background: transparent; border: none; padding: 6px 8px; font-size: 12px; color: #fff; outline: none; font-family: 'Poppins', sans-serif; }
    .chat-input-box button { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .trust-footer { text-align: center; padding: 12px; font-size: 12px; color: rgba(255, 255, 255, .6); border-top: 1px solid rgba(255, 255, 255, .04); margin-top: 15px; }
    .trust-footer a { color: #64b5f6; text-decoration: none; }
    
    .leaderboard-chat-wrapper { display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
    .top-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: rgba(0, 0, 0, .30); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, .05); }
    .menu-button { background: 0 0; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .online { font-size: 10px; color: #2ecc71; font-weight: 700; }
  </style>
</head>

<body>
  <!-- Toast d'erreur discret -->
  <div id="errorToast" class="error-toast">Impossible de lancer la partie. Réessayez.</div>

  <!-- Overlay visuel de fin de partie -->
  <div id="gameOverOverlay" class="game-over-overlay">
    <div class="game-over-title">PARTIE TERMINÉE</div>
  </div>

  <div class="gem-sparkle"></div>
  <div class="gem-sparkle"></div>
  <div class="gem-sparkle"></div>
  <div class="gem-sparkle"></div>
  <div class="gem-sparkle"></div>

  <aside id="sideMenu" class="side-menu">
    <button id="closeMenu" class="close-menu" type="button">×</button>
    <div class="side-menu-content">
      <h3>🧭 Menu Miltape</h3>
      <div class="menu-block">
        <button class="menu-nav-btn" type="button">🎮 Mes parties</button>
        <button class="menu-nav-btn" type="button">🏆 Mes classements</button>
        <button class="menu-nav-btn" type="button">💰 Mes gains</button>
      </div>
    </div>
  </aside>
  <div id="menuOverlay" class="menu-overlay"></div>

  <main id="mainApp" class="app">
    <header class="top-header">
      <button class="menu-button" id="menuButton" type="button">☰</button>
      <div class="online">
        <strong id="onlineCount">
          <span style="display:inline-block;width:7px;height:7px;background:#2ecc71;border-radius:50%;margin-right:4px"></span>
          <span>1 EN LIGNE</span>
        </strong>
      </div>
    </header>

    <section class="hero-banner-container">
      <img src="./tap-art.jpg" alt="Miltape World Challenge" class="hero-bg-image">
    </section>

    <!-- ZONE DE TAP & CHRONOMÈTRE -->
    <section class="tap-zone" aria-label="Zone de tap">
      <div class="rule" id="timerRule">
        <span class="rule-icon">⏱️</span>
        <strong id="timerRuleValue">00:02</strong>
        <small>CHRONO</small>
      </div>
      <button id="tapButton" class="tap-button" type="button">
        <img src="./tape.png" alt="TAP NOW" class="tap-img-bg" draggable="false">
      </button>
    </section>

    <!-- BOUTON REJOUER / LANCER LA PARTIE -->
    <button id="enterChallenge" class="main-play-button" type="button">
      <span id="btnText">JOUER MAINTENANT</span>
      <b id="btnArrow">➜</b>
    </button>

    <div class="leaderboard-chat-wrapper">
      <!-- CLASSEMENT TOP 5 ET POSITION DU JOUEUR -->
      <section class="leaderboard">
        <div class="section-title">
          <span>🏆 CLASSEMENT TOP 5</span>
          <span style="font-size: 11px; color: #64b5f6; font-weight: normal;">Gains ×2</span>
        </div>
        <div id="leaderboardList" class="leaderboard-list">
          <!-- Injecté dynamiquement par JS -->
        </div>
      </section>

      <!-- CHAT GLOBAL -->
      <section class="chat-section" id="globalChat">
        <div class="section-title" style="font-family:'Orbitron',sans-serif;font-size:12px;color:#fff;margin-bottom:8px;">💬 CHAT GLOBAL <strong>LIVE</strong></div>
        <div id="chatMessages" class="chat-messages">
          <div class="chat-message"><strong>Système :</strong> Bienvenue sur Miltape World Challenge !</div>
        </div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" placeholder="Écris ton message..." maxlength="500">
          <button id="chatSend" type="button">➤</button>
        </div>
      </section>
    </div>

    <div class="trust-footer">🔒 Transactions vérifiables sur la blockchain TRON. <a href="./conditions.html" target="_blank">Conditions</a></div>
  </main>

  <script>
    const BACKEND_URL = 'https://miltape-backend-production.up.railway.app';
    const socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });

    let myPlayerId = "player_current_xyz"; 
    let myCurrentBet = 100;
    let gameEndedTriggered = false;

    // =========================================================================
    // 🛡️ MACHINE À ÉTATS DU BOUTON REJOUER (idle → loading → ready)
    // =========================================================================
    let playButtonState = 'idle'; // 'idle' | 'loading' | 'ready'
    let loadingTimeout = null;

    const enterChallengeBtn = document.getElementById('enterChallenge');
    const btnTextSpan = document.getElementById('btnText');
    const btnArrowSpan = document.getElementById('btnArrow');
    const errorToast = document.getElementById('errorToast');
    const tapBtn = document.getElementById('tapButton');
    const timerElement = document.getElementById('timerRuleValue');

    function showToastError() {
      if (!errorToast) return;
      errorToast.classList.add('show');
      setTimeout(() => {
        errorToast.classList.remove('show');
      }, 3500);
    }

    function setPlayButtonState(newState) {
      playButtonState = newState;
      if (!enterChallengeBtn) return;

      if (playButtonState === 'loading') {
        enterChallengeBtn.classList.add('loading');
        enterChallengeBtn.disabled = true;
        if (btnTextSpan) btnTextSpan.textContent = 'CHARGEMENT...';
        if (btnArrowSpan) {
          btnArrowSpan.className = 'btn-spinner';
          btnArrowSpan.textContent = '';
        }
      } else if (playButtonState === 'ready' || playButtonState === 'idle') {
        enterChallengeBtn.classList.remove('loading');
        enterChallengeBtn.disabled = false;
        if (btnTextSpan) btnTextSpan.textContent = 'JOUER MAINTENANT';
        if (btnArrowSpan) {
          btnArrowSpan.className = '';
          btnArrowSpan.textContent = '➜';
        }
      }
    }

    // Gestionnaire du clic sur le bouton de rechargement/lancement (Anti-double clic)
    enterChallengeBtn.addEventListener('click', () => {
      if (playButtonState === 'loading') return;

      setPlayButtonState('loading');
      gameEndedTriggered = false;

      // Fallback de sécurité (6 secondes max)
      if (loadingTimeout) clearTimeout(loadingTimeout);
      loadingTimeout = setTimeout(() => {
        if (playButtonState === 'loading') {
          setPlayButtonState('idle');
          showToastError();
        }
      }, 6000);

      try {
        socket.emit('game:start', { playerId: myPlayerId, bet: myCurrentBet });
      } catch (e) {
        console.warn("⚠️ Erreur lors de l'émission Socket.IO:", e);
        if (loadingTimeout) clearTimeout(loadingTimeout);
        setPlayButtonState('idle');
        showToastError();
      }
    });

    socket.on('game:started', (data) => {
      if (loadingTimeout) clearTimeout(loadingTimeout);
      setPlayButtonState('ready');
      if (tapBtn) tapBtn.classList.remove('disabled');
      if (timerElement && data && data.duration) {
        timerElement.textContent = data.duration;
      }
    });

    socket.on('game:error', (err) => {
      if (loadingTimeout) clearTimeout(loadingTimeout);
      setPlayButtonState('idle');
      showToastError();
    });

    // =========================================================================
    // LOGIQUE DE FIN DE PARTIE & CHRONO
    let remainingTimeSeconds = 2; // Test initial

    function triggerGameOverTransition() {
      if (gameEndedTriggered) return;
      gameEndedTriggered = true;

      if (tapBtn) tapBtn.classList.add('disabled');

      const overlay = document.getElementById('gameOverOverlay');
      const mainApp = document.getElementById('mainApp');
      
      if (mainApp) mainApp.style.transform = 'scale(1.02)';
      if (overlay) overlay.classList.add('active');

      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'end-particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 100;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
        p.style.left = '50%';
        p.style.top = '50%';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }

      setTimeout(() => {
        if (mainApp) mainApp.style.transform = 'scale(1)';
      }, 400);

      setTimeout(() => {
        if (overlay) overlay.classList.remove('active');
        animateLeaderboardAppearance();
      }, 900);
    }

    const intervalTest = setInterval(() => {
      remainingTimeSeconds--;
      if (timerElement) {
        timerElement.textContent = `00:0${Math.max(0, remainingTimeSeconds)}`;
      }
      if (remainingTimeSeconds <= 0) {
        clearInterval(intervalTest);
        if (timerElement) timerElement.textContent = "00:00";
        triggerGameOverTransition();
      }
    }, 1000);

    socket.on("leaderboard:update", (data) => {
      renderLeaderboard(data.leaderboard || [], data.userPlayer || { id: myPlayerId, name: "MOI", taps: 420, rank: 8 });
    });

    function renderLeaderboard(topPlayers, currentPlayer) {
      const listContainer = document.getElementById('leaderboardList');
      if (!listContainer) return;
      listContainer.innerHTML = "";

      if (!topPlayers || topPlayers.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);font-size:12px;padding:12px;">Aucun joueur classé pour l\'instant</div>';
        return;
      }

      let isUserInTop5 = false;

      topPlayers.slice(0, 5).forEach((player, index) => {
        const rank = index + 1;
        const isMe = (player.id === myPlayerId || player.isMe);
        if (isMe) isUserInTop5 = true;

        const gainAmount = (player.taps || 0) > 0 ? `+${(myCurrentBet * 2)}` : `+0`;
        const cardClass = rank === 1 ? 'rank-card-1' : rank === 2 ? 'rank-card-2' : rank === 3 ? 'rank-card-3' : 'rank-card-compact';
        const highlightClass = isMe ? ' user-in-top' : '';

        const div = document.createElement('div');
        div.className = `${cardClass}${highlightClass} rank-card-animated`;
        div.setAttribute('data-rank-index', rank);
        
        div.innerHTML = `
          <div class="rank-left">
            <span class="rank-badge-styled">${rank}</span>
            <div class="player-details">
              <span class="player-name-text">${player.name || 'Anonyme'} ${isMe ? ' (VOUS)' : ''}</span>
              <span class="player-taps-text">${player.taps || 0} TAP</span>
            </div>
          </div>
          <div class="player-gain-text">${gainAmount}</div>
        `;
        listContainer.appendChild(div);
      });

      if (currentPlayer && !isUserInTop5 && currentPlayer.rank > 5) {
        const sep = document.createElement('div');
        sep.className = 'your-position-separator rank-card-animated';
        sep.setAttribute('data-rank-index', 'separator');
        listContainer.appendChild(sep);

        const userGain = `+${(myCurrentBet * 2)}`;
        const userDiv = document.createElement('div');
        userDiv.className = 'your-position-card rank-card-animated';
        userDiv.setAttribute('data-rank-index', 'user');
        userDiv.innerHTML = `
          <div class="rank-left">
            <span class="rank-badge-styled" style="background:rgba(100,181,246,0.3);color:#64b5f6;">${currentPlayer.rank}</span>
            <div class="player-details">
              <span class="player-name-text">📍 VOTRE POSITION (VOUS)</span>
              <span class="player-taps-text">${currentPlayer.taps || 0} TAP</span>
            </div>
          </div>
          <div class="player-gain-text">${userGain}</div>
        `;
        listContainer.appendChild(userDiv);
      }
    }

    function animateLeaderboardAppearance() {
      const cards = document.querySelectorAll('.rank-card-animated');
      cards.forEach((card) => {
        const rIndex = card.getAttribute('data-rank-index');
        let delay = 0;

        if (rIndex === '1') delay = 50;
        else if (rIndex === '2') delay = 150;
        else if (rIndex === '3') delay = 250;
        else if (rIndex === '4') delay = 330;
        else if (rIndex === '5') delay = 410;
        else delay = 480;

        setTimeout(() => {
          card.classList.add('show');
        }, delay);
      });
    }

    renderLeaderboard([
      { id: "p1", name: "PLAYER01", taps: 1248 },
      { id: "p2", name: "CYBERKINGS", taps: 980 },
      { id: "p3", name: "NEXUS_99", taps: 850 },
      { id: "p4", name: "TRON_MASTER", taps: 620 },
      { id: "p5", name: "SPEEDTAPPER", taps: 510 }
    ], { id: myPlayerId, name: "MOI", taps: 210, rank: 14 });

    // Menu latéral bascule
    document.getElementById('menuButton').addEventListener('click', () => {
      document.getElementById('sideMenu').classList.add('show');
      document.getElementById('menuOverlay').classList.add('show');
    });
    document.getElementById('closeMenu').addEventListener('click', () => {
      document.getElementById('sideMenu').classList.remove('show');
      document.getElementById('menuOverlay').classList.remove('show');
    });
    document.getElementById('menuOverlay').addEventListener('click', () => {
      document.getElementById('sideMenu').classList.remove('show');
      document.getElementById('menuOverlay').classList.remove('show');
    });
  </script>
</body>
</html>
