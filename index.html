<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILTAPE - Édition Royale</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0213;
            --panel-bg: rgba(15, 4, 28, 0.85);
            --royal-pink: #ff007f;
            --neon-blue: #00e5ff;
            --gold-base: #ffb703;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Poppins', sans-serif; }
        
        body {
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden;
            /* Utilisation de ton image tap-art.jpg avec un voile sombre par-dessus */
            background: linear-gradient(rgba(11, 2, 19, 0.65), rgba(11, 2, 19, 0.85)), url('tap-art.jpg') no-repeat center center / cover;
        }

        .app-container { width: 100%; max-width: 420px; position: relative; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 15px; display: flex; flex-direction: column; transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; pointer-events: none; transform: translateX(100%); }
        .view.active { opacity: 1; pointer-events: all; transform: translateX(0); }
        .view.prev { transform: translateX(-100%); }

        .title { font-family: 'Montserrat'; font-weight: 900; font-size: 3rem; color: var(--text-main); text-align: center; margin-bottom: 20px; text-shadow: 0 0 25px rgba(255, 0, 127, 0.6); }
        .title span { color: var(--royal-pink); }
        
        .main-input { width: 100%; background: rgba(255,255,255,0.05); border: 2px solid rgba(138,43,226,0.6); padding: 15px; border-radius: 15px; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 20px; outline: none; }
        .main-input:focus { border-color: var(--royal-pink); box-shadow: 0 0 15px rgba(255,0,127,0.4); }

        .play-btn { width: 100%; background: linear-gradient(135deg, var(--royal-pink), #8a2be2); padding: 16px; border-radius: 30px; border: none; font-family: 'Montserrat'; font-weight: 900; font-size: 1.1rem; color: #fff; cursor: pointer; box-shadow: 0 8px 25px rgba(255, 0, 127, 0.5); text-transform: uppercase; letter-spacing: 1px; }
        .play-btn:active { transform: scale(0.95); }

        /* VUE INSCRIPTION */
        #view-signup { justify-content: center; align-items: center; text-align: center; }

        /* VUE LOBBY */
        #view-lobby { justify-content: center; }
        .bets-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .bet-card { background: var(--panel-bg); border: 2px solid rgba(138, 43, 226, 0.4); padding: 15px; border-radius: 15px; cursor: pointer; text-align: center; backdrop-filter: blur(8px); }
        .bet-card.active { border-color: var(--royal-pink); background: rgba(255, 0, 127, 0.15); transform: scale(1.03); box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); }
        .bet-card h2 { font-family: 'Montserrat'; font-weight: 900; font-size: 1.5rem; color: #fff; }

        /* HUD JEU */
        .hud-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; z-index: 10; }
        .badge { background: rgba(255, 0, 127, 0.15); border: 1px solid var(--royal-pink); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: var(--royal-pink); }
        .players-online { font-size: 0.75rem; color: #a494c6; text-align: right; }
        .players-online strong { color: var(--neon-blue); display: block; font-size: 0.95rem; }

        /* ZONE TAPE */
        .tap-zone { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .magic-ring { position: absolute; width: 240px; height: 240px; border-radius: 50%; border: 2px solid rgba(255, 183, 3, 0.4); box-shadow: 0 0 30px rgba(255, 115, 0, 0.3), inset 0 0 30px rgba(0, 229, 255, 0.3); animation: spinRing 10s linear infinite; pointer-events: none; }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .tap-button { width: 150px; height: 150px; border-radius: 50%; cursor: pointer; background: radial-gradient(circle at 35% 35%, #ffb703, #ff007f); border: 4px solid #fff; box-shadow: 0 0 40px rgba(255, 183, 3, 0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: transform 0.05s; }
        .tap-button:active { transform: scale(0.90); }
        .tap-text { font-family: 'Montserrat'; font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* CLASSEMENT & CHAT */
        .social-section { background: var(--panel-bg); border-radius: 15px; padding: 12px; margin-top: auto; border: 1px solid rgba(138,43,226,0.3); max-height: 180px; display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(10px); }
        .tabs { display: flex; gap: 10px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .tab-btn { background: none; border: none; color: #a494c6; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .tab-btn.active { color: var(--royal-pink); border-bottom: 2px solid var(--royal-pink); }
        
        .tab-content { overflow-y: auto; flex-grow: 1; font-size: 0.8rem; }
        .hidden { display: none !important; }
        
        .chat-input-box { display: flex; gap: 5px; margin-top: 5px; }
        .chat-input { flex-grow: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(138,43,226,0.4); border-radius: 8px; padding: 5px 10px; color: #fff; font-size: 0.8rem; outline: none; }
        .chat-send { background: var(--royal-pink); color: #fff; border: none; padding: 5px 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        .lb-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. INSCRIPTION -->
        <div id="view-signup" class="view active">
            <h1 class="title">MIL<span>TAPE</span></h1>
            <p style="color: #a494c6; margin-bottom: 20px; font-size: 0.9rem;">Entre ton pseudo pour entrer dans l'arène</p>
            <input type="text" id="pseudoInput" class="main-input" placeholder="Ton Pseudo VIP" maxlength="12">
            <button class="play-btn" onclick="registerUser()">VALIDER MON PROFIL</button>
        </div>

        <!-- 2. LOBBY -->
        <div id="view-lobby" class="view">
            <h1 class="title" style="font-size: 2.2rem; margin-bottom: 10px;">LOBBY</h1>
            <p style="color: #a494c6; font-size: 0.85rem; margin-bottom: 20px; text-align: center;">Choisis ta mise, <span id="welcomeUser" style="color:#fff; font-weight:700;"></span></p>
            
            <div class="bets-grid">
                <div class="bet-card active" onclick="selectBet(this, 5)"><h2>5 €</h2><p style="color:#a494c6; font-size:0.75rem;">Standard</p></div>
                <div class="bet-card" onclick="selectBet(this, 10)"><h2>10 €</h2><p style="color:#a494c6; font-size:0.75rem;">Premium</p></div>
                <div class="bet-card" onclick="selectBet(this, 20)"><h2>20 €</h2><p style="color:#a494c6; font-size:0.75rem;">VIP</p></div>
                <div class="bet-card" onclick="selectBet(this, 50)"><h2>50 €</h2><p style="color:#a494c6; font-size:0.75rem;">Élite</p></div>
            </div>

            <button class="play-btn" onclick="startGameSession()">JOUER MAINTENANT</button>
        </div>

        <!-- 3. JEU -->
        <div id="view-game" class="view">
            <div class="hud-top">
                <div class="badge" id="gameTimer">00:10</div>
                <div class="players-online">EN LIGNE<strong id="onlineCount">1</strong></div>
            </div>

            <div style="text-align: center; margin-bottom: 5px; z-index:10;">
                <div style="font-size: 0.65rem; color: #a494c6; text-transform: uppercase;">Score en direct</div>
                <div style="font-family: 'Montserrat'; font-size: 2.5rem; font-weight: 900; color: var(--gold-base); text-shadow: 0 0 15px rgba(255,183,3,0.5);" id="scoreDisplay">0</div>
            </div>

            <div class="tap-zone">
                <div class="magic-ring"></div>
                <div class="tap-button" id="mainBtn">
                    <div class="tap-text">TAP!</div>
                </div>
            </div>

            <!-- Classement & Chat -->
            <div class="social-section">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('leaderboard', event)">🏆 Classement</button>
                    <button class="tab-btn" onclick="switchTab('chat', event)">💬 Chat</button>
                </div>

                <div id="tab-leaderboard" class="tab-content">
                    <div id="leaderboardList">Chargement...</div>
                </div>

                <div id="tab-chat" class="tab-content hidden" style="display:flex; flex-direction:column;">
                    <div id="chatMessages" style="flex-grow:1; overflow-y:auto; max-height:80px; margin-bottom:5px; font-size:0.75rem;"></div>
                    <div class="chat-input-box">
                        <input type="text" id="chatInput" class="chat-input" placeholder="Dis quelque chose...">
                        <button class="chat-send" onclick="sendChatMessage()">Envoyer</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Connexion au serveur Railway configurée
        const socket = io("https://miltape-backend-production.up.railway.app");

        let currentBet = 5; let score = 0; let gameInterval;

        function switchView(fromId, toId) {
            document.getElementById(fromId).classList.remove('active'); document.getElementById(fromId).classList.add('prev');
            const toView = document.getElementById(toId);
            toView.classList.remove('prev'); toView.classList.add('active');
        }

        function registerUser() {
            const pseudo = document.getElementById('pseudoInput').value;
            if(!pseudo || pseudo.trim() === "") {
                alert("Entre un pseudo valide !");
                return;
            }
            socket.emit('setPseudo', pseudo.trim());
        }

        socket.on('pseudoAccepted', (name) => {
            document.getElementById('welcomeUser').innerText = name;
            switchView('view-signup', 'view-lobby');
        });

        socket.on('updatePlayerCount', (count) => {
            document.getElementById('onlineCount').innerText = count;
        });

        socket.on('updateLeaderboard', (list) => {
            const lbContainer = document.getElementById('leaderboardList');
            lbContainer.innerHTML = "";
            list.forEach((p, index) => {
                lbContainer.innerHTML += `<div class="lb-row"><span>#${index+1} ${p.username}</span> <strong>${p.score} pts</strong></div>`;
            });
        });

        function selectBet(element, amount) {
            document.querySelectorAll('.bet-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active'); currentBet = amount;
        }

        function startGameSession() {
            switchView('view-lobby', 'view-game');
            score = 0; 
            document.getElementById('scoreDisplay').innerText = score;
            
            let timeLeft = 10;
            document.getElementById('gameTimer').innerText = `00:10`;

            if(gameInterval) clearInterval(gameInterval);

            gameInterval = setInterval(() => {
                timeLeft--;
                let s = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                document.getElementById('gameTimer').innerText = `00:${s}`;
                
                if(timeLeft <= 0) {
                    clearInterval(gameInterval);
                    alert("Fin de partie ! Ton score total : " + score);
                    switchView('view-game', 'view-lobby');
                }
            }, 1000);
        }

        document.getElementById('mainBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            score += 1;
            document.getElementById('scoreDisplay').innerText = score;
            socket.emit('playerTap', { points: 1 });
            if(navigator.vibrate) navigator.vibrate(30);
        });

        function switchTab(tabName, evt) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tabName === 'leaderboard') {
                document.getElementById('tab-leaderboard').classList.remove('hidden');
                document.getElementById('tab-chat').classList.add('hidden');
            } else {
                document.getElementById('tab-chat').classList.remove('hidden');
                document.getElementById('tab-leaderboard').classList.add('hidden');
            }
            evt.target.classList.add('active');
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if(input.value.trim() !== "") {
                socket.emit('sendMessage', input.value);
                input.value = "";
            }
        }

        socket.on('chatMessage', (data) => {
            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML += `<div><strong style="color:var(--royal-pink);">${data.sender}:</strong> ${data.text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
