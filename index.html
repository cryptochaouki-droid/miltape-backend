<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miltape World Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root { --gold: #ffd84d; --gold-border: rgba(255, 216, 77, 0.6); --tap-bg: radial-gradient(circle at 30% 30%, #2a0a3e, #12001f 80%); }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(ellipse at center, #0d0221 0%, #090014 70%, #050010 100%); }
        body { font-family: 'Orbitron', sans-serif; margin: 0; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        .app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }

        /* Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: rgba(9, 0, 20, 0.9); border-bottom: 1px solid rgba(255,255,255,.1); }
        .menu-button { background: none; border: none; color: #ffcc00; font-size: 14px; font-weight: 900; cursor: pointer; font-family: 'Orbitron'; }
        .online { font-size: 10px; color: #2ecc71; font-weight: bold; }
        .timer-header { background: rgba(0,0,0,.5); border: 1px solid rgba(255,204,0,.5); padding: 5px 10px; border-radius: 8px; text-align: center; }
        .timer-header small { display: block; font-size: 8px; color: #bbb; }
        .timer-header strong { display: block; font-size: 16px; color: #ffcc00; font-weight: 900; }

        /* Hero */
        .hero-banner-container { position: relative; width: calc(100% - 24px); margin: 12px auto; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 204, 0, 0.3); }
        .hero-bg-image { width: 100%; display: block; opacity: 0.8; }
        .hero-header-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; }
        .player-profile-badge { background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(255,204,0,.3); font-size: 10px; }
        .wallet-badge-top { background: rgba(0,0,0,.7); border: 1px solid rgba(193,60,255,.5); padding: 4px 8px; border-radius: 12px; text-align: right; cursor: pointer; }
        .wb-label { font-size: 7px; color: #bbb; display: block; }
        .wb-value { font-size: 13px; color: #ffcc00; font-weight: 900; }

        /* Mise */
        .mise-container { text-align: center; margin: 15px 0; }
        .mise-container input { width: 140px; padding: 10px; border-radius: 8px; background: rgba(26,26,46,.8); color: #fff; border: 1px solid #ffcc00; font-size: 16px; text-align: center; font-family: 'Orbitron'; }
        
        /* Boutons */
        .main-play-button { display: block; width: 80%; max-width: 300px; margin: 10px auto; padding: 14px 20px; background: linear-gradient(135deg, #ffcc00, #ff8a00); color: #16051f; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; font-family: 'Orbitron'; }
        .spectator-button { display: block; width: 80%; max-width: 300px; margin: 5px auto; padding: 12px 20px; background: rgba(139,44,255,.2); border: 2px solid rgba(139,44,255,.5); border-radius: 12px; color: #c13cff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Orbitron'; }
        #payButton { display: none; background: #00d2ff; color: #000; padding: 12px 24px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; margin: 5px auto; width: 80%; max-width: 300px; font-family: 'Orbitron'; }

        .tap-message { text-align: center; font-size: 13px; color: #b8b8b8; padding: 10px; }

        /* Tap */
        .tap-zone { min-height: 245px; display: flex; align-items: center; justify-content: center; }
        .tap-button { position: relative; width: 190px; height: 190px; border-radius: 50%; border: 3px solid var(--gold-border); background: var(--tap-bg); color: #fff; cursor: pointer; }
        .tap-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .tap-img-bg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; opacity: 0.8; }
        .tap-count { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; color: #ffcc00; font-weight: 900; }

        /* Classement */
        .leaderboard { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 15px; margin: 20px 16px; }
        .leaderboard h3 { color: #ffcc00; margin-top: 0; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,.1); }
        .leaderboard-item:nth-child(1) { border-left: 3px solid #ffd700; color: #ffd700; }

        /* Chat */
        .chat-section { margin: 20px 16px; }
        .chat-messages { height: 150px; overflow-y: auto; background: rgba(0,0,0,.3); border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,.1); }
        .chat-message { font-size: 12px; margin-bottom: 8px; }
        .chat-message strong { color: #ffcc00; }
        .chat-input-box { display: flex; gap: 10px; }
        .chat-input-box input { flex: 1; padding: 10px; background: #1a1a2e; color: #fff; border: 1px solid #ffcc00; border-radius: 8px; font-family: 'Orbitron'; }
        .chat-input-box button { background: #ffcc00; border: none; color: #16051f; font-weight: 900; border-radius: 8px; padding: 0 15px; cursor: pointer; font-family: 'Orbitron'; }
        
        /* Menu + Modales */
        .side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background: rgba(15,5,29,.95); z-index: 1000; transition: left .3s; padding: 20px; box-sizing: border-box; }
        .side-menu.show { left: 0; }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; z-index: 999; }
        .menu-overlay.show { display: block; }
        .close-menu { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; position: absolute; top: 10px; right: 15px; }
        .menu-nav-btn { display: block; width: 100%; background: none; border: none; color: #fff; text-align: left; padding: 12px; margin-bottom: 6px; cursor: pointer; font-family: 'Orbitron'; border-radius: 8px; }
        .legal-modal { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .legal-modal.show { display: flex; }
        .legal-content { background: rgba(18,6,36,.95); border: 1px solid #ffcc00; border-radius: 16px; max-width: 500px; width: 100%; padding: 20px; color: #fff; }
        .legal-content input { width: 100%; padding: 12px; margin-bottom: 10px; background: #1a1a2e; color: #fff; border: 1px solid #ffcc00; border-radius: 8px; box-sizing: border-box; }
        .legal-content button { width: 100%; padding: 12px; background: #ffcc00; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; }
        #toastBox { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; text-align: center; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <!-- MENU -->
    <aside id="sideMenu" class="side-menu">
        <button id="closeMenu" class="close-menu">X</button>
        <div style="margin-top: 40px;">
            <h3 style="color:#ffcc00;">MENU</h3>
            <button class="menu-nav-btn" id="menuGamesBtn">Mes parties</button>
            <button class="menu-nav-btn" id="menuRankingsBtn">Mes classements</button>
            <button class="menu-nav-btn" id="menuGainsBtn">Mes gains</button>
            <button class="menu-nav-btn" id="menuWithdrawalsBtn">Mes retraits</button>
            <button class="menu-nav-btn" id="menuReferralBtn">Parrainage</button>
            <button class="menu-nav-btn" id="menuRulesBtn">Règles</button>
            <div style="margin-top: 20px; text-align:center;">
                <button id="demomodebtn" class="menu-nav-btn" style="background:rgba(255,204,0,0.2); color:#ffcc00; text-align:center; border:1px solid rgba(255,204,0,.35);">ACTIVER MODE DEMO</button>
                <div id="demoStatus" style="font-size:10px; color:#888; margin-top:6px;">Désactivé</div>
            </div>
        </div>
    </aside>
    <div id="menuOverlay" class="menu-overlay"></div>

    <!-- MODALE -->
    <div id="dynamicModal" class="legal-modal">
        <div class="legal-content">
            <button id="closeDynamicModal" class="close-menu">X</button>
            <h3 id="dynamicModalTitle">Miltape</h3>
            <div id="dynamicModalBody"></div>
        </div>
    </div>

    <!-- APP -->
    <main class="app">
        <!-- HEADER AVEC CHRONO -->
        <header class="top-header">
            <button class="menu-button" id="menuButton">MENU</button>
            <div class="timer-header">
                <small>⏱️ TEMPS RESTANT</small>
                <strong id="timer">10:00</strong>
            </div>
            <div class="online"><span id="onlineCount">1 EN LIGNE</span></div>
        </header>

        <!-- HERO -->
        <section class="hero-banner-container">
            <img src="./tap-art.jpg" class="hero-bg-image">
            <div class="hero-header-overlay">
                <div class="player-profile-badge">MILTAPER</div>
                <div class="wallet-badge-top" id="enterChallengeTop">
                    <span class="wb-label">MISE USDT</span>
                    <span class="wb-value" id="displayBetTop">0</span>
                </div>
            </div>
        </section>

        <!-- MISE -->
        <div class="mise-container">
            <label style="color:#ffcc00; font-weight:bold; font-size:14px;">💰 MISE (USDT) :</label><br><br>
            <input type="number" id="betInput" min="0.5" max="1000000" step="0.5" value="10">
            <span style="color:#888; font-size:11px; display:block; margin-top:4px;">Min 0.50 - Max 1 000 000</span>
        </div>

        <button id="payButton">💳 PAYER MA MISE</button>
        <button id="enterChallenge" class="main-play-button">🎮 JOUER MAINTENANT</button>
        <button id="spectatorMode" class="spectator-button">👁️ REGARDER EN DIRECT</button>

        <div id="tapMessage" class="tap-message">⚡ CHOISIS TA MISE ET CONNECTE TON WALLET</div>

        <section class="tap-zone">
            <button id="tapButton" class="tap-button" disabled>
                <img src="./icon-192~2.jpg" class="tap-img-bg">
                <span id="tapButtonCount" class="tap-count">0</span>
            </button>
        </section>

        <!-- CLASSEMENT -->
        <div class="leaderboard">
            <h3>🏆 CLASSEMENT (TOP 5)</h3>
            <div id="leaderboardList"><div style="color:#888; padding:10px;">Aucun joueur</div></div>
        </div>

        <!-- CHAT -->
        <section class="chat-section" id="globalChat">
            <h3 style="color:#ffcc00; margin-top: 0;">💬 CHAT GLOBAL</h3>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-box">
                <input type="text" id="chatInput" placeholder="Écris ton message..." maxlength="200">
                <button id="chatSend">ENVOYER</button>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
