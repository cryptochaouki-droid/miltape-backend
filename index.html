<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d47a1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Miltape World Challenge — Tape, classe-toi, gagne." />
  <title>Miltape World Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest.json" />
  <!-- Correction du chemin d'icône 404 -->
  <link rel="apple-touch-icon" href="./icon-192.jpg" />
  <link rel="icon" href="./icon-192.jpg" type="image/jpeg" />
  
  <!-- 1. Script Telegram sécurisé avec vérification de version Haptic & BackButton -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function initTelegramWebApp() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          const w = window.Telegram.WebApp;
          w.ready();
          w.expand();
          
          // Vérification sécurisée pour le BackButton (version >= 6.1)
          try {
            if (w.version && parseFloat(w.version) >= 6.1) {
              if (w.BackButton) {
                w.BackButton.show();
                w.BackButton.onClick(function() { w.close(); });
              }
            }
          } catch (e) { console.warn("⚠️ BackButton non supporté:", e); }
          
          // HapticFeedback global sécurisé
          window.triggerHaptic = function(style = 'medium') {
            try {
              if (w.isVersionAtLeast && w.isVersionAtLeast('6.1') && w.HapticFeedback) {
                w.HapticFeedback.impactOccurred(style);
              }
            } catch (err) {
              console.warn("Haptic non supporté sur cette version", err);
            }
          };
          
          if (w.colorScheme) document.body.setAttribute('data-telegram-theme', w.colorScheme);
          console.log("✅ Telegram WebApp initialisée");
        }
      } catch (e) { console.warn("⚠️ Erreur init Telegram:", e); }
    })();
  </script>

  <!-- ===== DÉSACTIVATION FORCÉE DU CACHE ===== -->
  <script>
    if ('caches' in window) {
        caches.keys().then(function(names) {
            names.forEach(function(name) {
                caches.delete(name);
            });
        });
    }
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
                registration.unregister();
                console.log('✅ Service Worker désinstallé.');
            }
        });
    }
  </script>
  
  <!-- 2. CDN Socket.IO & Web3 -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(ellipse at 40% 30%, #1a6fb5 0%, #0d47a1 35%, #0a2a5c 65%, #051230 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .app { width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; padding-bottom: 80px; position: relative; z-index: 1; }
    .glass-card { background: rgba(255, 255, 255, .10); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 8px 32px rgba(0, 0, 0, .3); border-radius: 24px; }
    
    /* Style pour le conteneur TON Connect afin de l'intégrer proprement */
    #ton-connect-button-container {
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- En-tête de test -->
    <div style="padding: 20px; color: white; text-align: center;">
      <h1>Miltape World Challenge</h1>
      <p class="online">● Statut : <strong id="connectionStatus">Connexion en cours...</strong></p>
      
      <!-- Conteneur requis pour TON Connect -->
      <div id="ton-connect"></div>
    </div>
  </div>

  <!-- Scripts d'initialisation et Connexion Backend -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Initialisation sécurisée de TON Connect
      try {
        const tonContainer = document.getElementById('ton-connect');
        if (tonContainer && window.TON_CONNECT_UI) {
          window.tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://cryptochaouki-droid.github.io/miltape-backend/tonconnect-manifest.json', // Remplacez par votre lien de manifeste valide
            buttonRootId: 'ton-connect'
          });
          console.log("✅ TON Connect initialisé avec succès");
        } else {
          console.warn("⚠️ Conteneur ton-connect ou SDK manquant.");
        }
      } catch (err) {
        console.error("❌ Erreur TON Connect :", err);
      }

      // 2. Connexion WebSocket vers Railway (sans doubler le namespace socket.io)
      const BACKEND_URL = 'https://miltape-backend-production.up.railway.app';
      console.log("🔗 Tentative de connexion au Backend :", BACKEND_URL);

      const socket = io(BACKEND_URL, {
        transports: ['websocket', 'polling']
      });

      socket.on('connect', () => {
        console.log("✅ WebSocket connecté avec ID :", socket.id);
        const statusEl = document.getElementById('connectionStatus');
        if (statusEl) {
          statusEl.textContent = "Connecté au serveur";
          statusEl.style.color = "#2ecc71";
        }
      });

      socket.on('connect_error', (error) => {
        console.error("❌ Erreur connexion WebSocket :", error);
        const statusEl = document.getElementById('connectionStatus');
        if (statusEl) {
          statusEl.textContent = "Erreur de connexion";
          statusEl.style.color = "#ff4b2b";
        }
      });
    });
  </script>
</body>
</html>
