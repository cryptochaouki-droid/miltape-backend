<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE - Direct</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #0f172a; color: white; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; }
        input { width: 80%; padding: 12px; font-size: 16px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        button { width: 80%; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 8px; background: #22c55e; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card" id="box">
        <h2>MILTAPE</h2>
        <input type="text" id="p" placeholder="Ton pseudo">
        <br>
        <button id="btn">VALIDER</button>
    </div>

    <script>
        const socket = io();

        document.getElementById('btn').onclick = function() {
            const val = document.getElementById('p').value;
            if(val.trim() !== "") {
                alert("Clic OK, envoi vers le serveur...");
                socket.emit('setPseudo', val);
                socket.emit('joinQueue');
            } else {
                alert("Entre un pseudo !");
            }
        };

        socket.on('pseudoAccepted', () => {
            alert("Serveur OK ! Entrée dans le jeu...");
            document.getElementById('box').innerHTML = '<h2>C\'est parti !</h2><button onclick="location.reload()">Recharger</button>';
        });
    </script>
</body>
</html>
