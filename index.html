<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miltape World Challenge</title>
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <style>
        body { margin: 0; background: #090014; color: white; font-family: sans-serif; }
        
        /* HEADER SIMPLIFIÉ POUR LAISSER LE BOUTON APPARAÎTRE */
        .top-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            background: #0f051d;
            border-bottom: 1px solid #333;
        }

        /* FORCE LE BOUTON TON À ÊTRE VISIBLE */
        #ton-connect-button { 
            display: block !important; 
            min-height: 40px; 
        }

        .hero { text-align: center; padding: 20px; }
        .main-play-button { 
            width: 90%; 
            padding: 20px; 
            background: #ffcc00; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <header class="top-header">
        <button id="menuButton">☰</button>
        <!-- C'est ICI que le bouton doit apparaître -->
        <div id="ton-connect-button"></div>
    </header>

    <main class="hero">
        <h1>MILTAPE</h1>
        <button class="main-play-button">JOUER MAINTENANT</button>
    </main>

    <script>
        // Initialisation propre de TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://cryptochaouki-droid.github.io/miltape-backend/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        console.log("TON Connect initialisé");
    </script>
</body>
</html>
