<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILTAPE - MONDIAL</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #05020a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; }
        #online-count { color: #00ff66; font-weight: bold; }
        #btn-tap { width: 200px; height: 200px; border-radius: 50%; background: #ff6a00; border: none; font-size: 2rem; cursor: pointer; margin: 20px 0; }
        #chat-box { height: 150px; background: #111; overflow-y: scroll; text-align: left; padding: 10px; margin-bottom: 10px; border-radius: 10px; }
        #admin-panel { display: none; background: #330000; padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>MILTAPE</div>
        <div id="online-count">0 EN LIGNE</div>
    </div>

    <input type="text" id="pseudo" placeholder="Ton Pseudo" style="padding:10px; margin:10px 0;">
    <button onclick="savePseudo()">VALIDER</button>

    <div style="font-size: 2rem;">SCORE: <span id="score">0</span></div>
    <button id="btn-tap" onclick="tap()">TAP !</button>

    <div id="chat-box"></div>
    <input type="text" id="chat-input" placeholder="Message...">
    <button onclick="sendChat()">ENVOYER</button>

    <!-- Admin caché en bas à gauche -->
    <div onclick="unlockAdmin()" style="position:fixed; bottom:0; left:0; width:50px; height:50px; cursor:pointer;"></div>
    
    <div id="admin-panel">
        <h3>MODE ADMIN</h3>
        <p>Gère tout ici...</p>
    </div>

    <script>
        const socket = io();
        let currentPseudo = "Joueur";

        function savePseudo() { currentPseudo = document.getElementById('pseudo').value; }
        
        function tap() { socket.emit('playerTap'); }

        function sendChat() {
            const input = document.getElementById('chat-input');
            socket.emit('sendMessage', { pseudo: currentPseudo, text: input.value });
            input.value = '';
        }

        socket.on('scoreUpdated', (data) => {
            if(data.pseudo === currentPseudo) document.getElementById('score').innerText = data.score;
        });

        socket.on('newMessage', (msg) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><strong>${msg.pseudo}:</strong> ${msg.text}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('playerCountUpdate', (count) => {
            document.getElementById('online-count').innerText = count + " EN LIGNE";
        });

        function unlockAdmin() {
            let p = prompt("MDP ADMIN:");
            if(p === "1234") document.getElementById('admin-panel').style.display = 'block';
        }
    </script>
</body>
</html>
