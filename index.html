<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTAPE</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        #score { font-size: 3rem; margin: 20px 0; color: #ffcc00; }
        #btn-tap { width: 200px; height: 200px; border-radius: 50%; border: none; background: #ff5500; color: white; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px #cc4400; }
        #btn-tap:active { transform: translateY(5px); box-shadow: 0 5px #cc4400; }
        .info { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div>Joueurs en ligne : <span id="online-count">0</span></div>
    <div id="score">0</div>
    <button id="btn-tap" onclick="tap()">TAP !</button>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function tap() { socket.emit('playerTap'); }
        socket.on('scoreUpdated', (data) => { document.getElementById('score').innerText = data.score; });
        socket.on('playerCountUpdate', (count) => { document.getElementById('online-count').innerText = count; });
    </script>
</body>
</html>
