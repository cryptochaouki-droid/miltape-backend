<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miltape World Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="top-header">
            <button class="menu-button" id="menuButton">☰</button>
            <div class="online" id="onlineCount">
                <div class="online-dot"></div>
                <span>En ligne : <strong>1</strong></span>
            </div>
            <div class="wallet-box">
                <small>WALLET</small>
                <strong id="displayBet">0.00</strong>
            </div>
            <button class="wallet-button" id="menuRulesBtn">💎</button>
        </header>

        <section class="rules">
            <div class="rule">
                <div class="rule-icon">⏱️</div>
                <strong>10 MINUTES</strong>
                <small>PAR PARTIE</small>
            </div>
            <div class="rule">
                <div class="rule-icon">🏆</div>
                <strong>TOP 5</strong>
                <small>SEULEMENT</small>
            </div>
            <div class="rule">
                <div class="rule-icon">🪙</div>
                <strong>USDT</strong>
                <small>TRC20</small>
            </div>
        </section>

        <div class="timer-card">
            <small>PROCHAINE SESSION</small>
            <div class="timer" id="timer">10:00</div>
            <span>TEMPS RESTANT</span>
        </div>

        <section class="stats">
            <div class="stat-box">
                <small>TOTAL TAPS</small>
                <strong id="tapCount">0</strong>
            </div>
            <div class="stat-box">
                <small>CLASSEMENT</small>
                <strong id="user-rank">-</strong>
            </div>
            <div class="stat-box">
                <small>GAIN POT.</small>
                <strong id="potential-reward">0</strong>
            </div>
            <div class="stat-box">
                <small>MISES</small>
                <strong id="globalTotalStakes">0</strong>
            </div>
        </section>

        <button class="main-play-button" id="enterChallenge">
            <b>⚡</b> CHOISIS TA MISE ET CONNECTE TON WALLET
        </button>

        <div class="tap-message" id="tap-message"></div>

        <div class="tap-zone">
            <button class="tap-button" id="tapButton" disabled>
                <strong>TAP</strong>
                <small id="tapButtonCount">0</small>
                <div class="tap-glow"></div>
            </button>
        </div>

        <section class="leaderboard">
            <div class="leaderboard-list" id="leaderboardList">
                <div class="empty-ranking">Aucun joueur pour le moment</div>
            </div>
        </section>

        <section class="chat-section" id="globalChat">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-message"><strong>Système :</strong> Bienvenue dans le jeu !</div>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <input type="text" id="chatInput" placeholder="Écris ton message..." style="flex: 1; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: #fff; outline: none;">
                <button id="chatSend" style="padding: 0 15px; border-radius: 10px; border: none; background: #7b2cff; color: #fff; font-weight: bold; cursor: pointer;">Envoyer</button>
            </div>
        </section>
    </div>

    <!-- Fenêtre Modale Dynamique -->
    <div id="dynamicModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: #140521; border: 1px solid rgba(255,216,77,0.3); width: 100%; max-width: 420px; border-radius: 20px; padding: 20px; max-height: 90vh; overflow-y: auto; position: relative;">
            <button id="closeDynamicModal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;">✕</button>
            <h3 id="dynamicModalTitle" style="color: #ffcc00; margin-bottom: 15px; font-size: 18px;"></h3>
            <div id="dynamicModalBody"></div>
        </div>
    </div>

    <!-- Menu Latéral -->
    <div id="menuOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999;"></div>
    <div id="sideMenu" style="position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #10001b; z-index: 1000; transition: left 0.3s ease; padding: 20px; border-right: 1px solid rgba(255,255,255,0.1);">
        <button id="closeMenu" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; float: right;">✕</button>
        <h3 style="color: #ffcc00; margin-top: 30px; margin-bottom: 20px;">Menu</h3>
        <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 15px;">
            <li><button id="menuChatBtn" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer;">💬 Chat Global</button></li>
            <li><button id="menuRulesBtn2" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer;">📜 Règles</button></li>
            <li><button id="menuGamesBtn" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer;">🎮 Partie Actuelle</button></li>
            <li><button id="menuRankingsBtn" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer;">🏆 Classement</button></li>
        </ul>
    </div>

    <script>
        // Script pour gérer l'affichage de la modale et du menu latéral proprement
        const modal = document.getElementById('dynamicModal');
        const originalOpenModal = window.openModal;
        window.openModal = function() {
            if(modal) modal.style.display = 'flex';
        };
        const originalCloseModal = window.closeModal;
        window.closeModal = function() {
            if(modal) modal.style.display = 'none';
        };

        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        document.getElementById('menuButton')?.addEventListener('click', () => {
            if(sideMenu) sideMenu.style.left = '0';
            if(menuOverlay) menuOverlay.style.display = 'block';
        });
        const closeMenuFunc = () => {
            if(sideMenu) sideMenu.style.left = '-280px';
            if(menuOverlay) menuOverlay.style.display = 'none';
        };
        document.getElementById('closeMenu')?.addEventListener('click', closeMenuFunc);
        menuOverlay?.addEventListener('click', closeMenuFunc);
    </script>
    <script src="script.js"></script>
</body>
</html>
