<script>
// ✅ ROBUST FIX : On sépare l'UI du Socket pour que rien ne bloque jamais les boutons

const tapButton=document.getElementById('tapButton'),tapButtonCount=document.getElementById('tapButtonCount'),liveTapsCount=document.getElementById('liveTapsCount'),enterChallenge=document.getElementById('enterChallenge'),enterChallengeTop=document.getElementById('enterChallengeTop'),tapMessage=document.getElementById('tapMessage'),onlineCount=document.getElementById('onlineCount'),leaderboardList=document.getElementById('leaderboardList'),chatInput=document.getElementById('chatInput'),chatSend=document.getElementById('chatSend'),chatMessages=document.getElementById('chatMessages'),betInput=document.getElementById('betInput'),payButton=document.getElementById('payButton'),tokenSelect=document.getElementById('tokenSelect'),demoBtn=document.getElementById('demomodebtn'),demoStatus=document.getElementById('demoStatus'),demoToggleLabel=document.getElementById('demoToggleLabel'),menuButton=document.getElementById('menuButton'),sideMenu=document.getElementById('sideMenu'),closeMenu=document.getElementById('closeMenu'),menuOverlay=document.getElementById('menuOverlay'),resetGameBtn=document.getElementById('resetGameBtn');

let isPlaying=false,isPaid=false,myPlayerId=null,myBet=10,myWallet=null,myToken='USDT';
let myDepositAmount = 0;

function getDeviceId(){let deviceId=localStorage.getItem("miltape_device_id");if(!deviceId){if(crypto.randomUUID){deviceId=crypto.randomUUID()}else{deviceId='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16)})}localStorage.setItem("miltape_device_id",deviceId)}return deviceId}
const deviceId = getDeviceId();

function formatAmount(value){return Number(parseFloat(value).toFixed(8)).toString()}

function hapticLight(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}}
function hapticMedium(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('medium')}catch(e){}}
function hapticHeavy(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy')}catch(e){}}
function hapticSuccess(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.notificationOccurred('success')}catch(e){}}
function hapticError(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.notificationOccurred('error')}catch(e){}}

let audioCtx;document.addEventListener('touchstart',initAudio,{once:true});document.addEventListener('click',initAudio,{once:true});
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}

let demoMode=localStorage.getItem("miltape_demo")==="true"||false;
function updateDemoUI(){ if(demoMode){ if(demoStatus) demoStatus.textContent="🔬 Mode démo ACTIVÉ"; if(demoBtn) demoBtn.style.background="rgba(100,181,246,0.2)"; } else { if(demoStatus) demoStatus.textContent="🔒 Mode démo désactivé"; if(demoBtn) demoBtn.style.background="rgba(100,181,246,0.12)"; } }
function toggleDemoMode(){demoMode=!demoMode;localStorage.setItem("miltape_demo",String(demoMode));updateDemoUI();hapticMedium();alert(demoMode?"🔬 Mode démo ACTIVÉ !":"🔒 Mode démo désactivé.")}
if(demoBtn)demoBtn.addEventListener('click',toggleDemoMode);updateDemoUI();

// ✅ 1. ATTACHER LES BOUTONS UI D'ABORD (Ne plante JAMAIS)
function joinGame(){initAudio();const telegramName=getTelegramUser();let name=telegramName||prompt("Entre ton pseudo pour le classement :");if(!name)return;let wallet;if(demoMode){try{if(typeof tronWeb!=='undefined'&&tronWeb&&tronWeb.createAccount){const account=tronWeb.createAccount();wallet=account.address.base58}else{wallet="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb"}}catch(e){wallet="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb"}}else{wallet=prompt("Entre ton adresse TRON (ex: T...) :");if(!wallet)return}const token=tokenSelect?tokenSelect.value:'USDT';let bet=10;if(betInput){const rawBet=parseFloat(String(betInput.value).replace(',', '.'));if(!isNaN(rawBet)&&rawBet>=0.5&&rawBet<=1000000000000){bet=rawBet}else{bet=10}}myBet=bet;myWallet=wallet;myToken=token;
  if(typeof socket !== 'undefined' && socket.emit) { socket.emit("player:join",{name,wallet,bet,token,deviceId}); } else { alert("Connexion au serveur en cours... Patientez 10 secondes puis réessayez."); }
  hapticMedium()}
if(enterChallenge)enterChallenge.addEventListener('click',joinGame);if(enterChallengeTop)enterChallengeTop.addEventListener('click',joinGame);

function tapEffects(){if(!tapButton)return;tapButton.classList.add('tap-active');setTimeout(()=>tapButton.classList.remove('tap-active'),100);hapticLight()}
let lastTapTime=0;const MIN_TAP_INTERVAL_MS=50;
if(tapButton){tapButton.addEventListener('click',function(e){if(!isPlaying||tapButton.disabled||!isPaid){if(!isPaid&&tapMessage){tapMessage.innerText="⏳ Tu dois payer ta mise avant de taper !";hapticError();setTimeout(()=>{if(tapMessage)tapMessage.innerText="💰 ÉTAPE 2 : Paie ta mise pour taper !"},3000)}return}const now=Date.now();if(now-lastTapTime<MIN_TAP_INTERVAL_MS)return;lastTapTime=now;tapEffects();socket.emit("player:tap")})}

function sendMessage(){if(!chatInput)return;const text=chatInput.value.trim();if(text){if(text.length>500){alert("Message trop long (500 caractères max) !");return}if(text.includes('<')||text.includes('>')){alert("Les balises HTML ne sont pas autorisées !");return}if(typeof socket !== 'undefined' && socket.emit) { socket.emit("chat:send",{message:text}); } chatInput.value=""}}
if(chatSend)chatSend.addEventListener('click',sendMessage);if(chatInput)chatInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')sendMessage()});

function toggleMenu(){if(sideMenu&&menuOverlay){sideMenu.classList.toggle('show');menuOverlay.classList.toggle('show')}}
if(menuButton)menuButton.addEventListener('click',toggleMenu);if(closeMenu)closeMenu.addEventListener('click',toggleMenu);if(menuOverlay)menuOverlay.addEventListener('click',toggleMenu);

if(resetGameBtn){resetGameBtn.addEventListener('click',function(){if(confirm("🔄 Voulez-vous vraiment recommencer une nouvelle partie ? Vos données locales seront effacées.")){localStorage.removeItem("miltape_player_id");localStorage.removeItem("miltape_player_wallet");localStorage.removeItem("miltape_player_name");localStorage.removeItem("miltape_player_bet");localStorage.removeItem("miltape_player_token");localStorage.removeItem("miltape_spectator");localStorage.removeItem("miltape_demo");localStorage.removeItem("miltape_device_id");window.location.reload()}})}

// ✅ 2. MAINTENANT, ON INITIALISE LE SOCKET (Dans un bloc sécurisé !)
let socket;
try {
  // ✅ URL CORRIGÉE : Pointe vers ton service Railway ACTUEL
  const BACKEND_URL = "https://thorough-gratitude-production.up.railway.app"; 
  if (typeof io !== 'undefined') {
    socket = io(BACKEND_URL);
    window.API_URL = BACKEND_URL;
  } else {
    console.error("❌ Socket.io CDN bloqué ! Les boutons UI fonctionnent, mais pas la connexion en temps réel.");
  }
} catch (e) {
  console.error('❌ Erreur init Socket:', e.message);
  socket = { on: function(){}, emit: function(){} };
}

// ✅ 3. ATTACHER LES ÉCOUTEURS SOCKET SEULEMENT SI DISPONIBLE
if (socket && typeof socket.on === 'function') {
  socket.on('connect', async()=>{console.log('✅ Socket connecté :',socket.id); await restoreSession();});
  socket.on('connect_error',(err)=>{console.error('Erreur Socket:',err.message);});
  
  socket.on("player:joined",(data)=>{if(data.success){isPlaying=true;isPaid=false;myPlayerId=data.player.id;myToken=data.player.token||'USDT';myDepositAmount=data.player.depositAmount||data.player.bet;if(tapButton)tapButton.disabled=true;if(enterChallenge)enterChallenge.style.display="none";if(tapButtonCount)tapButtonCount.innerText=data.player.taps;if(liveTapsCount)liveTapsCount.innerText=data.player.taps;if(betInput){betInput.value=formatAmount(myDepositAmount);betInput.disabled=true}if(demoMode){isPaid=true;if(tapButton)tapButton.disabled=false;fetch(BACKEND_URL+"/api/demo/verify",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:data.player.id})}).catch(err=>console.error(err))}else{if(payButton){payButton.style.display='block';payButton.onclick=()=>initiatePayment(data.player.wallet)}}hapticMedium()}});

  socket.on("player:restored",(data)=>{if(data.success){isPlaying=true;myPlayerId=data.player.id;myWallet=data.player.wallet;myBet=data.player.bet||10;myToken=data.player.token||'USDT';myDepositAmount=data.player.depositAmount||data.player.bet;if(demoMode){isPaid=true;if(tapButton)tapButton.disabled=false;}else{isPaid=data.player.paid||false;if(tapButton)tapButton.disabled=!isPaid;if(payButton){if(!isPaid){payButton.style.display='block';payButton.onclick=()=>initiatePayment(data.player.wallet)}else payButton.style.display='none'}}if(enterChallenge)enterChallenge.style.display="none";localStorage.setItem("miltape_player_id",data.player.id);hapticMedium()}});

  socket.on("payment:verified",(data)=>{if(data.verified){isPaid=true;if(tapButton)tapButton.disabled=false;hapticSuccess();if(tapMessage)tapMessage.innerText="✅ Paiement vérifié ! ÉTAPE 3 : Tape maintenant !";if(payButton)payButton.style.display='none'}});

  // ✅ MISE À JOUR DU CHRONO ET DU CLASSEMENT
  socket.on("game:state",(data)=>{
    const timerRuleValue=document.getElementById('timerRuleValue');
    const timerRule=document.getElementById('timerRule');
    if(timerRuleValue && data.game){
        const remaining = data.game.remainingSeconds || 0;
        const m = Math.floor(remaining/60); const s = remaining%60;
        timerRuleValue.innerText = m + ":" + s.toString().padStart(2, '0');
        if (isPaid && isPlaying && remaining <= 10) timerRule.classList.add('urgent');
        else timerRule.classList.remove('urgent');
    }
    if(data.players){
        if(leaderboardList){
            leaderboardList.innerHTML="";
            if(data.players.length === 0){ leaderboardList.innerHTML='<div class="empty-ranking">Aucun joueur pour le moment</div>'; }
            else {
                data.players.forEach((player, index) => {
                    const div=document.createElement('div'); div.className='leaderboard-item';
                    const rankSpan=document.createElement('span'); rankSpan.className='rank-badge'; rankSpan.textContent=index+1;
                    const nameSpan=document.createElement('span'); nameSpan.className='player-name'; nameSpan.textContent=player.name;
                    const scoreSpan=document.createElement('span'); scoreSpan.className='player-score'; scoreSpan.textContent=player.taps;
                    div.appendChild(rankSpan); div.appendChild(nameSpan); div.appendChild(scoreSpan);
                    leaderboardList.appendChild(div);
                });
            }
        }
        if(onlineCount){ onlineCount.innerHTML = '<span style="display:inline-block;width:8px;height:8px;background:#2ecc71;border-radius:50%;margin-right:5px"></span><span>'+data.players.length+' EN LIGNE</span>'; }
    }
  });

  socket.on("player:update",(data)=>{ if(data.id === myPlayerId){ if(tapButtonCount) tapButtonCount.innerText = data.taps; if(liveTapsCount) liveTapsCount.innerText = data.taps; } });
  
  socket.on("game:finished",(data)=>{ stopAllMusic();if(tapButtonCount)tapButtonCount.innerText="0";if(liveTapsCount)liveTapsCount.innerText="0";isPlaying=false;isPaid=false;if(tapButton)tapButton.disabled=true;if(tapMessage)tapMessage.innerText="🏆 Partie terminée !";if(enterChallenge)enterChallenge.style.display='block';if(payButton)payButton.style.display='none';if(betInput)betInput.disabled=false;localStorage.removeItem("miltape_player_id");localStorage.removeItem("miltape_player_wallet");localStorage.removeItem("miltape_player_name");localStorage.removeItem("miltape_player_bet");localStorage.removeItem("miltape_player_token");launchConfetti(); if(data.winners){ data.winners.forEach((winner, index)=>{ setTimeout(()=>addWinnerToTicker(winner.name, formatAmount(winner.gain), winner.rank), index*200); }); } });

  socket.on("chat:message",(data)=>{ if(chatMessages){ const msgDiv=document.createElement('div'); msgDiv.className='chat-message'; const strong=document.createElement('strong'); strong.textContent=data.name+' :'; const textNode=document.createTextNode(' '+data.message); msgDiv.appendChild(strong); msgDiv.appendChild(textNode); chatMessages.appendChild(msgDiv); chatMessages.scrollTop=chatMessages.scrollHeight; } });
}

function initiatePayment(wallet){const finalAmount=myDepositAmount;const token=tokenSelect?tokenSelect.value:(localStorage.getItem("miltape_player_token")||'USDT');fetch("https://thorough-gratitude-production.up.railway.app/api/wallet").then(res=>res.json()).then(data=>{if(data.success){const serverWallet=data.wallet;const startParam=encodeURIComponent('transfer-'+serverWallet+'-'+formatAmount(finalAmount)+'-'+token);const paymentUrl='https://t.me/wallet?start='+startParam;window.open(paymentUrl,'_blank');hapticMedium();alert("💰 Envoie EXACTEMENT "+formatAmount(finalAmount)+" "+token+" (TRC20) vers :\n"+serverWallet+"\n\n✅ Le paiement sera détecté automatiquement !")}else{hapticError();alert("❌ Impossible de récupérer le wallet du serveur.")}}).catch(err=>{hapticError();alert("❌ Erreur lors de la récupération du wallet.");console.error(err)})});

function launchConfetti(){const colors=['#64b5f6','#ffd700','#2ecc71','#42a5f5','#ff6b6b','#ffd93d','#6c5ce7','#fd79a8'];for(let i=0;i<60;i++){const c=document.createElement('div'),size=6+Math.random()*10,isCircle=Math.random()>.5;c.style.cssText='position:fixed;width:'+size+'px;height:'+(isCircle?size:size*.4)+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:'+(isCircle?'50%':'2px')+';top:-10px;left:'+(Math.random()*100)+'%;z-index:9999;pointer-events:none;animation:confettiFall '+(2+Math.random()*2)+'s linear forwards;animation-delay:'+(Math.random()*.8)+'s;transform:rotate('+(Math.random()*360)+'deg);box-shadow:0 0 6px rgba(255,255,255,0.1)';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}

const winnerTicker=document.getElementById('winnerTicker'),tickerTrack=document.getElementById('tickerTrack');let tickerItems=[];const MAX_TICKER_ITEMS=20;
function addWinnerToTicker(name,amount,rank){if(!name)return;const existing=tickerItems.find(item=>item.name===name);if(existing){existing.amount=amount;updateTickerDisplay();return}const emoji=rank===1?'🏆':rank===2?'🥈':rank===3?'🥉':'🏅';tickerItems.push({name,amount,rank,emoji});if(tickerItems.length>MAX_TICKER_ITEMS)tickerItems.shift();updateTickerDisplay();showTicker()}
function buildTickerItemEl(item){const span=document.createElement('span');span.className='ticker-item';const trophy=document.createElement('span');trophy.className='trophy';trophy.textContent=item.emoji;const nameSpan=document.createElement('span');nameSpan.className='name';nameSpan.textContent=item.name;const arrow=document.createElement('span');arrow.textContent='→';const amountSpan=document.createElement('span');amountSpan.className='amount';amountSpan.textContent=typeof item.amount==='number'?formatAmount(item.amount)+' USDT':item.amount;span.appendChild(trophy);span.appendChild(nameSpan);span.appendChild(arrow);span.appendChild(amountSpan);return span}
function updateTickerDisplay(){if(!tickerTrack)return;tickerTrack.innerHTML="";const doubled=[...tickerItems,...tickerItems],frag=document.createDocumentFragment();doubled.forEach(item=>frag.appendChild(buildTickerItemEl(item)));tickerTrack.appendChild(frag);tickerTrack.style.animation='none';void tickerTrack.offsetWidth;tickerTrack.style.animation='tickerScroll 20s linear infinite'}

eur de chargement des gains.</p>')})})}

(function initTelegramBackButton(){try{if(window.Telegram&&window.Telegram.WebApp){const w=window.Telegram.WebApp;w.expand();w.BackButton.show();w.BackButton.onClick(function(){w.close()})}}catch(e){}})();
function getTelegramUser(){try{if(window.Telegram&&window.Telegram.WebApp){const user=window.Telegram.WebApp.initDataUnsafe?.user;if(user&&user.username)return user.username;if(user&&user.first_name)return user.first_name}return null}catch(e){return null}}
let jackpotCountdownInterval=null;
function updateJackpotCountdown(nextDrawTime){const el=document.getElementById('jackpotCountdown');if(!el)return;if(!nextDrawTime||typeof nextDrawTime!=='number'||nextDrawTime<=Date.now()){el.textContent="Tirage en cours...";if(jackpotCountdownInterval){clearInterval(jackpotCountdownInterval);jackpotCountdownInterval=null}socket.emit("jackpot:get");return}if(jackpotCountdownInterval){clearInterval(jackpotCountdownInterval);jackpotCountdownInterval=null}function update(){const now=Date.now();let diff=nextDrawTime-now;if(diff<=0){el.textContent="Tirage en cours...";clearInterval(jackpotCountdownInterval);jackpotCountdownInterval=null;socket.emit("jackpot:get");return}const days=Math.floor(diff/(1e3*60*60*24));const hours=Math.floor((diff%(1e3*60*60*24))/(1e3*60*60));const minutes=Math.floor((diff%(1e3*60*60))/(1e3*60));const seconds=Math.floor((diff%1e3)/1e3);let display="";if(days>0)display+=days+"j ";if(hours>0||days>0)display+=hours+"h ";if(minutes>0||hours>0||days>0)display+=minutes+"m ";display+=seconds+"s";el.textContent=display}update();jackpotCountdownInterval=setInterval(update,1e3)}
socket.on("jackpot:update",(data)=>{const prizeElement=document.getElementById('jackpotAmount');if(prizeElement)prizeElement.textContent=formatAmount(data.prize)+" USDT";if(data.nextDraw)updateJackpotCountdown(data.nextDraw);else{const countdownElement=document.getElementById('jackpotCountdown');if(countdownElement)countdownElement.textContent="--"}});
socket.emit("jackpot:get");
</script>
