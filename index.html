<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MILTAPE</title>
    <!-- Chargement auto de socket.io -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Test Connexion</h1>
    <input type="text" id="pseudo" placeholder="Pseudo">
    <button id="btn">VALIDER</button>

    <script>
        console.log("Script chargé avec succès");
        
        // Connexion sans spécifier d'URL (utilise l'URL actuelle du site)
        const socket = io();

        socket.on('connect', () => {
            console.log("Connecté au serveur avec ID :", socket.id);
        });

        document.getElementById('btn').onclick = () => {
            const p = document.getElementById('pseudo').value;
            console.log("Envoi du pseudo :", p);
            socket.emit('setPseudo', p);
        };

        socket.on('pseudoAccepted', () => {
            alert("Pseudo validé !");
        });
    </script>
</body>
</html>
