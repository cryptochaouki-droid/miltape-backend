<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILTAPE</title>
    <style>
        /* Force le plein écran sans débordement */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #121212; color: white; 
            font-family: Arial, sans-serif;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            overflow: hidden; /* Empêche le scroll sur téléphone */
        }
        
        .header { position: absolute; top: 10px; color: #888; font-size: 0.9rem; }
        
        #score { font-size: 4rem; font-weight: bold; color: #ffcc00; margin-bottom: 20px; }
        
        #btn-tap { 
            width: 250px; height: 250px; 
            border-radius: 50%; border: 8px solid #ff9900; 
            background: #ff5500; color: white; 
            font-size: 2rem; font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 15px #cc4400;
            touch-action: manipulation; /* Évite le délai au clic sur mobile */
            -webkit-tap-highlight-color: transparent;
        }
        
        #btn-tap:active { 
            transform: translateY(10px); 
            box-shadow: 0 5px #cc4400; 
        }
    </style>
</head>
<body>
    <div class="header">En ligne : <span id="online-count">0</span></div>
    <div id="score">0</div>
    <button id="btn-tap" onclick="tap()">TAP</button>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function tap() { 
            socket.emit('playerTap'); 
            // Feedback physique sur téléphone
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        }
        socket.on('scoreUpdated', (data) => { document.getElementById('score').innerText = data.score; });
        socket.on('playerCountUpdate', (count) => { document.getElementById('online-count').innerText = count; });
    </script>
</body>
</html>
