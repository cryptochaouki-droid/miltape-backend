<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILTAPE - MONDIAL</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            background: #05020a; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            background-image: radial-gradient(circle at 50% 30%, rgba(100, 40, 180, 0.3) 0%, transparent 60%);
        }
        .top-bar { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        #online-count { color: #00ff66; font-weight: bold; }
        
        /* -- LE NOUVEAU BOUTON TAP ULTRA DESIGN -- */
        .tap-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btn-tap {
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            background: radial-gradient(circle, #ffaa00 0%, #ff3300 50%, #4a00e0 100%);
            border: 4px solid #ffcc00; 
            font-size: 2.2rem; 
            font-weight: 900;
            color: #ffffff; 
            cursor: pointer; 
            position: relative;
            z-index: 2;
            box-shadow: 0 0 35px rgba(255, 106, 0, 0.6), inset 0 0 25px rgba(255, 255, 255, 0.5);
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        #btn-tap:active { 
            transform: scale(0.92); 
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.9), inset 0 0 35px rgba(0, 255, 255, 0.8);
        }

        /* Effet de vagues lumineuses (style portail cosmique) */
        .tap-container::before, .tap-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 204, 0, 0.4);
            animation: pulse-ring 2.5s infinite linear;
            pointer-events: none;
        }
        .tap-container::before { width: 100%; height: 100%; animation-delay: 0s; }
        .tap-container::after { width: 100%; height: 100%; animation-delay: 1.25s; }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        #chat-box { height: 130px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); overflow-y: scroll; text-align: left; padding: 10px; margin-bottom: 10px; border-radius: 10px; }
        #admin-panel { display: none; background: #330000; padding: 20px; margin-top: 20px; border-radius: 10px; }
        
        .input-box { padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; width: 80%; max-width: 300px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>👑 MILTAPE</div>
        <div id="online-count">0 EN LIGNE</div>
    </div>

    <div style="margin-top: 15px;">
        <input type="text" id="pseudo" class="input-box" placeholder="Ton Pseudo">
        <br>
        <button onclick="savePseudo()" style="padding: 8px 20px; background: #ffcc00; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">VALIDER</button>
    </div>

    <div style="font-size: 1.5rem; margin-top: 20px;">SCORE: <span id="score" style="color: #ffcc00; font-size: 2.5rem; font-weight: 900;">0</span></div>

    <!-- BOUTON TAP MAGIQUE AVEC EFFET DE VAGUES -->
    <div class="tap-container">
        <button id="btn-tap" onclick="tap()">TAP !</button>
    </div>

    <div style="width: 90%; max-width: 350px; margin: 0 auto;">
        <div id="chat-box"></div>
        <input type="text" id="chat-input" class="input-box" placeholder="Écris un message..." style="width: 100%;">
        <button onclick="sendChat()" style="padding: 8px; width: 100%; background: #00d2ff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px;">ENVOYER</button>
    </div>

    <!-- Admin caché en bas à gauche -->
    <div onclick="unlockAdmin()" style="position:fixed; bottom:0; left:0; width:50px; height:50px; cursor:pointer;"></div>
    
    <div id="admin-panel">
        <h3>MODE ADMIN</h3>
        <p>Panneau de contrôle secret actif.</p>
    </div>

    <script>
        const socket = io();
        let currentPseudo = "Joueur";

        function savePseudo() {
            const val = document.getElementById('pseudo').value.trim();
            if(val) {
                currentPseudo = val;
                socket.emit('setPseudo', currentPseudo);
                alert("Pseudo enregistré : " + currentPseudo);
            }
        }
        
        function tap() { 
            socket.emit('playerTap'); 
            // Petite vibration tactile sur mobile si disponible
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            if(input.value.trim() !== "") {
                socket.emit('sendMessage', { pseudo: currentPseudo, text: input.value });
                input.value = '';
            }
        }

        socket.on('scoreUpdated', (data) => {
            if(data.pseudo === currentPseudo) {
                document.getElementById('score').innerText = data.score;
            }
        });

        socket.on('newMessage', (msg) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><strong>${msg.pseudo}:</strong> ${msg.text}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('playerCountUpdate', (count) => {
            document.getElementById('online-count').innerText = count + " EN LIGNE";
        });

        function unlockAdmin() {
            let p = prompt("MDP ADMIN:");
            if(p === "1234") document.getElementById('admin-panel').style.display = 'block';
        }
    </script>
</body>
</html>
