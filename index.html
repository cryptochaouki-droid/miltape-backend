    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- =========================================================
               INITIALISATION TELEGRAM WEBBAPP
               ========================================================= -->
    <script>
        (function initTelegramWebApp() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const webapp = window.Telegram.WebApp;

                    // 1. Agrandir l'app pour utiliser tout l'écran
                    webapp.expand();

                    // 2. Activer le bouton "Retour"
                    webapp.BackButton.show();
                    webapp.BackButton.onClick(function() {
                        webapp.close();
                    });

                    // 3. Appliquer le thème (déjà fait dans script.js, mais on le fait aussi ici)
                    if (webapp.colorScheme) {
                        document.body.setAttribute('data-telegram-theme', webapp.colorScheme);
                    }

                    console.log("✅ Telegram WebApp initialisée avec bouton retour");
                } else {
                    console.log("ℹ️ Pas de Telegram WebApp détecté (navigation normale)");
                }
            } catch (e) {
                console.warn("⚠️ Erreur init Telegram WebApp:", e);
            }
        })();
    </script>

            position: relative;

        .tap-button {
            position: relative;
            width: 190px;
            height: 190px;
            min-width: 190px;
            min-height: 190px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 204, 0, 0.05);
            backdrop-filter: blur(5px);
            overflow: visible;
            cursor: pointer;
            outline: none;
            transition: transform .08s ease-in-out, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.1);
        }

        .tap-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .tap-button:not(:disabled):hover {
            box-shadow: 0 0 60px rgba(255, 204, 0, 0.2);
        }

        .tap-img-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 0;
            display: block;
            border-radius: 50%;
        }

        .tap-button::before {
            display: none;
        }

        .tap-button strong,
        .tap-button small,
        .tap-button .tap-glow {
            position: relative;
            z-index: 2;
        }

        .tap-button strong {
            display: none;
        }

        .tap-button small {

            bottom: 14px;

            margin-top: 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .9);
            pointer-events: none;
        }

        .tap-button:active:not(:disabled) {
            transform: scale(.92);
        }

        .tap-button.tap-active {
            transform: scale(.94);
            box-shadow: 0 0 80px rgba(255, 204, 0, 0.3);
        }
