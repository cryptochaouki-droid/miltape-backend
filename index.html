<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0d47a1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Miltape World Challenge — Tape, classe-toi, gagne." />
<title>Miltape World Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192~2.jpg" />
<link rel="icon" href="./icon-192~2.jpg" type="image/jpeg" />
<link rel="stylesheet" href="./style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
body{font-family:'Poppins',sans-serif;background:#0d47a1;margin:0;padding:0;color:#fff;overflow-x:hidden}
.app{width:100%;max-width:480px;margin:0 auto;padding-bottom:80px}
.top-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(0,0,0,0.3)}
.menu-button{background:none;border:none;color:#fff;font-size:24px}
.online{font-size:12px;color:#2ecc71}
.wallet-box{text-align:right}
#displayBet, #displayBetTop{color:#64b5f6;font-weight:bold}
.main-play-button{display:block;width:85%;max-width:320px;margin:20px auto;padding:15px;background:#ff416c;border:none;border-radius:24px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.tap-zone{width:100%;height:300px;display:flex;align-items:center;justify-content:center;position:relative}
#timerRule{position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.9);border-radius:16px;padding:5px 10px;color:#0d47a1;font-weight:bold}
#liveTapsRule{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.9);border-radius:16px;padding:5px 10px;color:#0d47a1;font-weight:bold}
.tap-button{width:200px;height:200px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:20px;cursor:pointer}
.leaderboard-chat-wrapper{padding:0 16px;margin-top:20px}
.leaderboard, .chat-section{background:rgba(255,255,255,0.1);border-radius:24px;padding:15px;margin-bottom:20px}
.chat-messages{background:#fff;color:#333;border-radius:12px;height:150px;overflow-y:auto;padding:10px}
.chat-input-box{display:flex;margin-top:10px}
.chat-input-box input{flex:1;padding:10px;border-radius:8px;border:none}
#tokenSelect, #betInput{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:10px;border-radius:8px;margin:5px}
</style>
</head>
<body>
<div class="app">
<header class="top-header">
<button class="menu-button" id="menuButton">☰</button>
<div class="online"><strong id="onlineCount">0 EN LIGNE</strong></div>
<div class="wallet-box"><small>MISE</small><strong id="displayBet">$0</strong></div>
</header>
<button id="enterChallenge" class="main-play-button">JOUER MAINTENANT ➜</button>
<div class="tap-zone">
<div class="rule" id="timerRule"><span>⏱️</span><strong id="timerRuleValue">10:00</strong></div>
<div class="rule" id="liveTapsRule"><span>👆</span><strong id="liveTapsCount">0</strong></div>
<button id="tapButton" class="tap-button" disabled>TAP</button>
</div>
<div class="leaderboard-chat-wrapper">
<div class="leaderboard"><h3>🏆 CLASSEMENT</h3><div id="leaderboardList">Aucun joueur</div></div>
<div class="chat-section"><h3>💬 CHAT</h3><div id="chatMessages" class="chat-messages">Bienvenue !</div><div class="chat-input-box"><input type="text" id="chatInput" placeholder="Message..."><button id="chatSend">➤</button></div></div>
</div>
</div>
<script>
// ✅ ROBUST FIX : On sépare l'UI du Socket pour que rien ne bloque jamais les boutons
const tapButton=document.getElementById('tapButton'),tapButtonCount=document.getElementById('tapButtonCount'),liveTapsCount=document.getElementById('liveTapsCount'),enterChallenge=document.getElementById('enterChallenge'),enterChallengeTop=document.getElementById('enterChallengeTop'),tapMessage=document.getElementById('tapMessage'),onlineCount=document.getElementById('onlineCount'),leaderboardList=document.getElementById('leaderboardList'),chatInput=document.getElementById('chatInput'),chatSend=document.getElementById('chatSend'),chatMessages=document.getElementById('chatMessages'),betInput=document.getElementById('betInput'),payButton=document.getElementById('payButton'),tokenSelect=document.getElementById('tokenSelect'),demoBtn=document.getElementById('demomodebtn'),demoStatus=document.getElementById('demoStatus'),demoToggleLabel=document.getElementById('demoToggleLabel'),menuButton=document.getElementById('menuButton'),sideMenu=document.getElementById('sideMenu'),closeMenu=document.getElementById('closeMenu'),menuOverlay=document.getElementById('menuOverlay'),resetGameBtn=document.getElementById('resetGameBtn');
let isPlaying=false,isPaid=false,myPlayerId=null,myBet=10,myWallet=null,myToken='USDT';
let myDepositAmount = 0;
function getDeviceId(){let deviceId=localStorage.getItem("miltape_device_id");if(!deviceId){if(crypto.randomUUID){deviceId=crypto.randomUUID()}else{deviceId='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16)})}localStorage.setItem("miltape_device_id",deviceId)}return deviceId}
const deviceId = getDeviceId();
function formatAmount(value){return Number(parseFloat(value).toFixed(8)).toString()}
function hapticMedium(){try{if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.HapticFeedback.impactOccurred('medium')}catch(e){}}
let demoMode=localStorage.getItem("miltape_demo")==="true"||false;
function joinGame(){const telegramName=getTelegramUser();let name=telegramName||prompt("Entre ton pseudo :");if(!name)return;let wallet;if(demoMode){wallet="T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb"}else{wallet=prompt("Entre ton adresse TRON (ex: T...) :");if(!wallet)return}const token=tokenSelect?tokenSelect.value:'USDT';let bet=10;if(betInput){const rawBet=parseFloat(betInput.value);if(!isNaN(rawBet)&&rawBet>=0.5)bet=rawBet}myBet=bet;myWallet=wallet;myToken=token;if(typeof socket !== 'undefined' && socket.emit) {socket.emit("player:join",{name,wallet,bet,token,deviceId});}else{alert("Connexion au serveur en cours... Patientez 10 secondes puis réessayez.")}hapticMedium()}
if(enterChallenge)enterChallenge.addEventListener('click',joinGame);if(enterChallengeTop)enterChallengeTop.addEventListener('click',joinGame);
function tapEffects(){if(!tapButton)return;tapButton.classList.add('tap-active');setTimeout(()=>tapButton.classList.remove('tap-active'),100);hapticMedium()}
let lastTapTime=0;const MIN_TAP_INTERVAL_MS=50;
if(tapButton){tapButton.addEventListener('click',function(e){if(!isPlaying||tapButton.disabled||!isPaid){alert("Tu dois payer ta mise avant de taper !");return}const now=Date.now();if(now-lastTapTime<MIN_TAP_INTERVAL_MS)return;lastTapTime=now;tapEffects();socket.emit("player:tap")})}
function sendMessage(){if(!chatInput)return;const text=chatInput.value.trim();if(text){if(typeof socket !== 'undefined' && socket.emit) {socket.emit("chat:send",{message:text});}chatInput.value=""}}
if(chatSend)chatSend.addEventListener('click',sendMessage);if(chatInput)chatInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')sendMessage()});
if(menuButton)menuButton.addEventListener('click',function(){alert("Menu simple (fonctionnalités complètes à venir)");});
let socket;
try {
  // ✅ URL CORRIGÉE : Pointe vers ton service Railway ACTUEL
  const BACKEND_URL = "https://thorough-gratitude-production.up.railway.app"; 
  if (typeof io !== 'undefined') {
    socket = io(BACKEND_URL);
    window.API_URL = BACKEND_URL;
  } else {
    console.error("❌ Socket.io CDN bloqué !");
  }
} catch (e) {
  console.error('❌ Erreur init Socket:', e.message);
  socket = { on: function(){}, emit: function(){} };
}
if (socket && typeof socket.on === 'function') {
  socket.on('connect', async()=>{console.log('✅ Socket connecté :',socket.id);});
  socket.on("player:joined",(data)=>{if(data.success){isPlaying=true;isPaid=false;myPlayerId=data.player.id;myToken=data.player.token||'USDT';myDepositAmount=data.player.depositAmount||data.player.bet;if(tapButton)tapButton.disabled=true;if(enterChallenge)enterChallenge.style.display="none";localStorage.setItem("miltape_player_id",data.player.id);localStorage.setItem("miltape_player_wallet",data.player.wallet);localStorage.setItem("miltape_player_name",data.player.name);if(payButton){payButton.style.display='block';}hapticMedium()}});
  socket.on("payment:verified",(data)=>{if(data.verified){isPaid=true;if(tapButton)tapButton.disabled=false;alert("Paiement vérifié ! Tape maintenant !")}});
  socket.on("game:state",(data)=>{
    const timerRuleValue=document.getElementById('timerRuleValue');
    if(timerRuleValue && data.game){const remaining = data.game.remainingSeconds || 0;const m = Math.floor(remaining/60);const s = remaining%60;timerRuleValue.innerText = m + ":" + s.toString().padStart(2, '0');}
    if(data.players){if(leaderboardList){leaderboardList.innerHTML="";data.players.forEach((player, index) => {const div=document.createElement('div');div.className='leaderboard-item';div.innerHTML='#'+(index+1)+' '+player.name+' - '+player.taps+' taps';leaderboardList.appendChild(div);});}}
  });
  socket.on("player:update",(data)=>{if(data.id===myPlayerId){if(liveTapsCount)liveTapsCount.innerText=data.taps;}});
  socket.on("chat:message",(data)=>{if(chatMessages){const msgDiv=document.createElement('div');msgDiv.innerHTML='<strong>'+data.name+' :</strong> '+data.message;chatMessages.appendChild(msgDiv);chatMessages.scrollTop=chatMessages.scrollHeight;}});
}
function getTelegramUser(){try{if(window.Telegram&&window.Telegram.WebApp){const user=window.Telegram.WebApp.initDataUnsafe?.user;if(user&&user.username)return user.username;if(user&&user.first_name)return user.first_name}return null}catch(e){return null}}
</script>
</body>
</html>
