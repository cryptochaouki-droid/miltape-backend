<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0d47a1" />
<title>Miltape World Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192~2.jpg" />
<link rel="icon" href="./icon-192~2.jpg" type="image/jpeg" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tronweb@6.0.4/dist/TronWeb.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
  /* ===== STYLES GLOBAUX ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(ellipse at 40% 30%, #1a6fb5 0%, #0d47a1 35%, #0a2a5c 65%, #051230 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 10px 0 40px;
    margin: 0;
    color: #fff;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: rgba(0,0,0,0.2);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  /* ===== TOP HEADER ===== */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    padding: 10px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
  }
  .menu-button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  .online { font-size: 12px; color: #2ecc71; font-weight: 700; }
  .wallet-box { text-align: right; }
  .wallet-box small { font-size: 9px; color: rgba(255,255,255,0.6); }
  .wallet-box strong { font-size: 16px; color: #64b5f6; }
  .wallet-button { background: rgba(100,181,246,0.15); border: 1px solid rgba(100,181,246,0.3); border-radius: 10px; color: #fff; padding: 4px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

  /* ===== CAGNOTTE ===== */
  #jackpotDisplay {
    background: linear-gradient(145deg, rgba(139,0,0,0.95), rgba(200,30,30,0.9));
    border-radius: 20px;
    padding: 16px;
    margin: 12px 0;
    text-align: center;
    border: 1px solid rgba(255,80,80,0.6);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(255,30,30,0.5);
    animation: pulseGlow 2s ease-in-out infinite alternate;
  }
  @keyframes pulseGlow {
    0% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 15px rgba(255,30,30,0.4); }
    100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 30px rgba(255,30,30,0.7); }
  }
  .jackpot-badge {
    background: rgba(255,215,0,0.2);
    border: 1px solid #ffd700;
    color: #ffd700;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 16px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .jackpot-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
    margin-bottom: 10px;
  }
  .jackpot-main-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .jackpot-left, .jackpot-right {
    flex: 1;
  }
  .jackpot-divider {
    width: 2px;
    height: 50px;
    background: rgba(255,215,0,0.4);
  }
  .jackpot-label {
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #jackpotAmount {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.6);
  }
  #jackpotCountdown {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #2ecc71;
    text-shadow: 0 0 15px rgba(46,204,113,0.6);
  }
  .jackpot-schedule {
    font-size: 9px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }

  /* ===== CHRONO + COMPTEUR DE TAPS ===== */
  .tap-zone {
    position: relative;
    width: 100%;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
  }
  #timerRule {
    position: absolute;
    top: 0;
    left: 0;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 15px rgba(100,181,246,0.3);
    font-size: 12px;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.8);
  }
  #timerRule .rule-icon { font-size: 16px; color: #0d47a1; }
  #timerRuleValue {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: #0d47a1;
  }
  #timerRule small { font-size: 10px; color: #222; font-weight: 700; }
  #tapCounterDisplay {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 900;
    color: #0d47a1;
    margin-left: 4px;
  }
  .tap-counter-label {
    font-size: 9px;
    color: #555;
    font-weight: 600;
    margin-left: 2px;
  }

  /* ===== BOUTON TAP ===== */
  .tap-button {
    position: relative;
    width: 260px;
    height: 260px;
    min-width: 260px;
    min-height: 260px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    overflow: hidden;
    cursor: pointer;
    outline: 0;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    padding: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    box-shadow: 0 0 50px rgba(100,181,246,0.15);
    border: 2px solid rgba(100,181,246,0.2);
    flex-shrink: 0;
  }
  .tap-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .tap-button:active:not(:disabled) {
    transform: scale(0.88);
  }
  .tap-button.tap-active {
    transform: scale(0.85);
    box-shadow: 0 0 80px rgba(100,181,246,0.4);
  }
  .tap-img-bg {
    position: absolute;
    inset: 0;
    width: 80%;
    height: 80%;
    margin: auto;
    object-fit: contain;
    pointer-events: none;
    z-index: 0;
    display: block;
    opacity: 0.9;
  }
  @media (max-width: 430px) {
    .tap-button { width: 210px; height: 210px; min-width: 210px; min-height: 210px; }
    .tap-img-bg { width: 85%; height: 85%; }
  }
  @media (max-width: 360px) {
    .tap-button { width: 180px; height: 180px; min-width: 180px; min-height: 180px; }
  }

  /* ===== LEADERBOARD ===== */
  .leaderboard, .chat-section {
    background: rgba(255,255,255,0.92);
    border-radius: 20px;
    padding: 16px;
    margin-top: 16px;
    color: #222;
  }
  .section-title {
    font-weight: 700;
    font-size: 16px;
    color: #222;
    margin-bottom: 10px;
  }
  .section-title span { color: #0d47a1; }
  .leaderboard-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f0f4f8;
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 4px;
    border-left: 3px solid #0d47a1;
  }
  .rank-badge {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #0d47a1;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    flex-shrink: 0;
  }
  .leaderboard-item:nth-child(1) .rank-badge { background: #ffd700; color: #000; }
  .leaderboard-item:nth-child(2) .rank-badge { background: #c0c0c0; color: #000; }
  .leaderboard-item:nth-child(3) .rank-badge { background: #cd7f32; color: #fff; }
  .player-name { flex: 1; font-weight: 600; }
  .player-score { font-weight: 900; color: #0d47a1; }

  /* ===== CHAT ===== */
  .chat-messages {
    height: 150px;
    overflow-y: auto;
    background: #f5f7fa;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .chat-message {
    background: #e9edf2;
    padding: 6px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
  }
  .chat-input-box {
    display: flex;
    gap: 6px;
  }
  .chat-input-box input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .chat-input-box button {
    background: #0d47a1;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 18px;
    cursor: pointer;
  }

  /* ===== BOUTON JOUER ===== */
  .main-play-button {
    display: block;
    width: 100%;
    max-width: 300px;
    margin: 12px auto;
    padding: 16px;
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: #fff;
    border: none;
    font-weight: 900;
    font-size: 18px;
    border-radius: 30px;
    box-shadow: 0 6px 0 #990000, 0 10px 30px rgba(255,65,108,0.4);
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.1s ease;
  }
  .main-play-button:active { transform: translateY(4px); box-shadow: 0 2px 0 #990000; }

  /* ===== RÈGLES ===== */
  .rules {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 6px 0 12px;
  }
  .rule {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rule strong { color: #64b5f6; }

  /* ===== SERVEUR WALLET ===== */
  .server-wallet-box {
    text-align: center;
    margin: 8px 0;
    padding: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    font-size: 12px;
  }
  .server-wallet-address {
    font-weight: 700;
    color: #64b5f6;
    word-break: break-all;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 480px) {
    .app { padding: 10px; }
    .jackpot-title { font-size: 18px; }
    #jackpotAmount { font-size: 24px; }
    #jackpotCountdown { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- En-tête -->
  <header class="top-header">
    <button class="menu-button" id="menuButton">☰</button>
    <div class="online"><span id="onlineCount">● 1 EN LIGNE</span></div>
    <div class="wallet-box">
      <small>MISE</small>
      <strong id="displayBet">$0</strong>
    </div>
    <button class="wallet-button" id="walletButton">💰 <span id="globalTotalStakes">$0</span></button>
  </header>

  <!-- JACKPOT -->
  <div id="jackpotDisplay">
    <div class="jackpot-badge">🎁 CAGNOTTE DU SAMEDI</div>
    <div class="jackpot-title">🏆 JACKPOT</div>
    <div class="jackpot-main-row">
      <div class="jackpot-left">
        <div class="jackpot-label">💰 MONTANT</div>
        <div id="jackpotAmount">0 USDT</div>
      </div>
      <div class="jackpot-divider"></div>
      <div class="jackpot-right">
        <div class="jackpot-label">⏳ TIRAGE DANS</div>
        <div id="jackpotCountdown">--</div>
        <div class="jackpot-schedule">📅 CHAQUE SAMEDI</div>
      </div>
    </div>
  </div>

  <!-- CHOIX CRYPTO / MISE -->
  <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:8px 0;">
    <select id="tokenSelect">
      <option value="USDT">USDT (TRC20)</option>
      <option value="USDC">USDC (TRC20)</option>
      <option value="TUSD">TUSD (TRC20)</option>
      <option value="TRX">TRX</option>
    </select>
    <input type="text" id="betInput" value="10" style="width:100px; padding:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:12px; color:#fff; text-align:center; font-size:16px;">
  </div>

  <!-- BOUTON JOUER -->
  <button id="enterChallenge" class="main-play-button">🔥 JOUER MAINTENANT</button>

  <!-- ZONE TAP -->
  <section class="tap-zone">
    <div id="timerRule">
      <span class="rule-icon">⏱️</span>
      <strong id="timerRuleValue">10:00</strong>
      <small>EN DIRECT</small>
      <span style="margin-left:10px; border-left:1px solid rgba(0,0,0,0.15); padding-left:10px; display:flex; align-items:center; gap:3px;">
        <span style="font-size:14px;">👆</span>
        <span id="tapCounterDisplay">0</span>
        <span class="tap-counter-label">TAPS</span>
      </span>
    </div>
    <button id="tapButton" class="tap-button" disabled>
      <img src="./tape.png" alt="TAP" class="tap-img-bg" draggable="false">
    </button>
  </section>

  <!-- RÈGLES -->
  <div class="rules">
    <div class="rule"><span>🏆</span><strong>TOP 5</strong><small>gagne x2</small></div>
  </div>

  <!-- CLASSEMENT -->
  <div class="leaderboard">
    <div class="section-title"><span>🏆 CLASSEMENT</span> <span style="color:#0d47a1;">TOP 5</span></div>
    <div id="leaderboardList"><div class="empty-ranking">Aucun joueur</div></div>
  </div>

  <!-- CHAT -->
  <div class="chat-section">
    <div class="section-title"><span>💬 CHAT GLOBAL</span> <span style="color:#0d47a1;">LIVE</span></div>
    <div id="chatMessages" class="chat-messages">
      <div class="chat-message"><strong>Système :</strong> Bienvenue sur Miltape !</div>
    </div>
    <div class="chat-input-box">
      <input type="text" id="chatInput" placeholder="Écris un message..." maxlength="500">
      <button id="chatSend">➤</button>
    </div>
  </div>

  <!-- INFOS SERVEUR -->
  <div class="server-wallet-box">
    <div>🛡️ Envoie ta mise vers</div>
    <div class="server-wallet-address" id="serverWalletDisplay">TKavpq1A2gFFCFN7d2nxMuNndy8LVGNXTL</div>
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
  const socket = io("https://miltape-backend-production.up.railway.app");
  const API_URL = "https://miltape-backend-production.up.railway.app";

  // Éléments DOM
  const tapButton = document.getElementById('tapButton');
  const enterChallenge = document.getElementById('enterChallenge');
  const timerRuleValue = document.getElementById('timerRuleValue');
  const tapCounterDisplay = document.getElementById('tapCounterDisplay');
  const leaderboardList = document.getElementById('leaderboardList');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const chatMessages = document.getElementById('chatMessages');
  const betInput = document.getElementById('betInput');
  const tokenSelect = document.getElementById('tokenSelect');
  const jackpotAmount = document.getElementById('jackpotAmount');
  const jackpotCountdown = document.getElementById('jackpotCountdown');
  const onlineCount = document.getElementById('onlineCount');

  // Variables globales
  let isPlaying = false, isPaid = false, myPlayerId = null, myBet = 10, myWallet = null, myToken = 'USDT';
  let endsAt = null;
  let timerInterval = null;
  let demoMode = localStorage.getItem("miltape_demo") === "true" || false;
  const MY_DEVICE_ID = localStorage.getItem("miltape_device_id") || (window.crypto?.randomUUID?.() || "dev_" + Date.now());

  // ===== MISE À JOUR DU CHRONO =====
  function updateTimerDisplay() {
    if (!timerRuleValue) return;
    if (!endsAt) { timerRuleValue.innerText = '--:--'; return; }
    const now = Date.now();
    let remaining = Math.max(0, Math.floor((endsAt - now) / 1000));
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    timerRuleValue.innerText = m + ":" + String(s).padStart(2, '0');
  }

  // ===== MISE À JOUR DU COMPTEUR DE TAPS =====
  function updateTapCounter(taps) {
    if (tapCounterDisplay) tapCounterDisplay.textContent = taps || 0;
  }

  // ===== INTERVALLE LOCAL POUR LE CHRONO =====
  function startLocalTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (endsAt) {
        updateTimerDisplay();
        if (Date.now() >= endsAt) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }
    }, 200);
  }
  startLocalTimer();

  // ===== ÉVÉNEMENTS SOCKET =====
  socket.on('connect', () => { console.log('✅ Socket connecté'); });
  socket.on('reconnect', () => { socket.emit('timer:request'); });

  // Chrono
  socket.on("timer:update", (data) => {
    if (data.endsAt) {
      endsAt = new Date(data.endsAt).getTime();
      updateTimerDisplay();
    }
  });

  // Démarrage de partie
  socket.on("game:started", (data) => {
    if (data.endsAt) {
      endsAt = new Date(data.endsAt).getTime();
      updateTimerDisplay();
    }
  });

  // État complet
  socket.on("game:state", (data) => {
    if (data.game && data.game.endsAt) {
      endsAt = new Date(data.game.endsAt).getTime();
      updateTimerDisplay();
    }
  });

  // Joueur rejoint
  socket.on("player:joined", (data) => {
    if (data.success) {
      isPlaying = true;
      isPaid = false;
      myPlayerId = data.player.id;
      myToken = data.player.token || 'USDT';
      tapButton.disabled = true;
      updateTapCounter(data.player.taps);
      localStorage.setItem("miltape_player_id", data.player.id);
      localStorage.setItem("miltape_player_wallet", data.player.wallet);
      localStorage.setItem("miltape_player_name", data.player.name);
      localStorage.setItem("miltape_player_bet", data.player.bet.toString());
      localStorage.setItem("miltape_player_token", myToken);
      if (demoMode) {
        isPaid = true;
        tapButton.disabled = false;
        // Auto‑verify en mode démo
        fetch(API_URL + "/api/demo/verify", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerId: data.player.id })
        }).catch(err => console.error(err));
      } else {
        // Afficher bouton payer (à implémenter)
      }
    }
  });

  // Restauration
  socket.on("player:restored", (data) => {
    if (data.success) {
      isPlaying = true;
      myPlayerId = data.player.id;
      myWallet = data.player.wallet;
      myBet = data.player.bet || 10;
      myToken = data.player.token || 'USDT';
      isPaid = data.player.paid || false;
      tapButton.disabled = !isPaid;
      updateTapCounter(data.player.taps);
      localStorage.setItem("miltape_player_id", data.player.id);
      localStorage.setItem("miltape_player_wallet", data.player.wallet);
      localStorage.setItem("miltape_player_name", data.player.name);
      localStorage.setItem("miltape_player_bet", data.player.bet.toString());
      localStorage.setItem("miltape_player_token", myToken);
    }
  });

  // Tap
  socket.on("player:update", (data) => {
    if (myPlayerId && data.id === myPlayerId) {
      updateTapCounter(data.taps);
    }
  });

  // Score
  socket.on("player:score", (data) => {
    updateTapCounter(data.taps);
  });

  // Paiement vérifié
  socket.on("payment:verified", (data) => {
    if (data.verified) {
      isPaid = true;
      tapButton.disabled = false;
    }
  });

  // Fin de partie
  socket.on("game:finished", (data) => {
    isPlaying = false;
    isPaid = false;
    tapButton.disabled = true;
    // Alert ou affichage des gagnants...
  });

  // Classement
  socket.on("leaderboard:update", (leaderboard) => {
    if (!leaderboardList) return;
    leaderboardList.innerHTML = '';
    if (!leaderboard || leaderboard.length === 0) {
      leaderboardList.innerHTML = '<div class="empty-ranking">Aucun joueur</div>';
      return;
    }
    leaderboard.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'leaderboard-item';
      div.innerHTML = `<span class="rank-badge">${i+1}</span>
                      <span class="player-name">${p.name}</span>
                      <span class="player-score">${p.taps}</span>`;
      leaderboardList.appendChild(div);
    });
  });

  // Jackpot
  socket.on("jackpot:update", (data) => {
    if (jackpotAmount) jackpotAmount.textContent = (data.prize || 0).toFixed(2) + ' USDT';
    if (jackpotCountdown && data.nextDraw) {
      const diff = data.nextDraw - Date.now();
      if (diff <= 0) { jackpotCountdown.textContent = 'Tirage en cours...'; return; }
      const days = Math.floor(diff / (24*3600*1000));
      const hours = Math.floor((diff % (24*3600*1000)) / (3600*1000));
      const mins = Math.floor((diff % (3600*1000)) / (60000));
      const secs = Math.floor((diff % 60000) / 1000);
      let str = '';
      if (days) str += days + 'j ';
      if (hours || days) str += hours + 'h ';
      if (mins || hours || days) str += mins + 'm ';
      str += secs + 's';
      jackpotCountdown.textContent = str;
    }
  });

  // Online count
  socket.on("online:count", (count) => {
    if (onlineCount) onlineCount.textContent = `● ${count} EN LIGNE`;
  });

  // Chat
  socket.on("chat:message", (data) => {
    if (!chatMessages) return;
    const div = document.createElement('div');
    div.className = 'chat-message';
    div.innerHTML = `<strong>${data.name} :</strong> ${data.message}`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });

  // ===== CLIC SUR LE BOUTON TAP =====
  tapButton.addEventListener('click', function(e) {
    if (!isPlaying || this.disabled || !isPaid) return;
    this.classList.add('tap-active');
    setTimeout(() => this.classList.remove('tap-active'), 150);
    socket.emit("player:tap");
  });

  // ===== REJOINDRE LA PARTIE =====
  enterChallenge.addEventListener('click', () => {
    const name = prompt("Pseudo :") || "Joueur";
    const wallet = prompt("Adresse TRON (T...) :") || "T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb";
    const bet = parseFloat(betInput.value) || 10;
    const token = tokenSelect.value;
    myBet = bet;
    myWallet = wallet;
    myToken = token;
    socket.emit("player:join", { name, wallet, bet, token, deviceId: MY_DEVICE_ID });
  });

  // ===== ENVOI CHAT =====
  function sendChat() {
    const msg = chatInput.value.trim();
    if (!msg) return;
    socket.emit("chat:send", { message: msg });
    chatInput.value = '';
  }
  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendChat(); });

  // ===== DEMANDE INITIALE DU JACKPOT =====
  socket.emit("jackpot:get");

  // ===== MODE DÉMO (simple toggle) =====
  // Ajoutez un bouton dans le menu si souhaité

  console.log("✅ Frontend Miltape chargé.");
</script>
</body>
</html>
